<title>ムンドTOP対面帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F0F5; --surface:#FFFFFF; --surface-2:#E9E5EF; --line:#D6D0DF;
  --ink:#1D1826; --ink-2:#4E4660; --ink-3:#7C7390;
  --accent:#6A3E9E; --accent-soft:#E6DCF3; --on-accent:#FFFFFF;
  --atk:#1E7F63; --atk-soft:#D9EFE7;
  --even:#A86A12; --even-soft:#F5E7CF;
  --def:#B8352B; --def-soft:#F6DDDA;
  --shadow:0 1px 2px rgba(29,24,38,.06),0 6px 20px rgba(29,24,38,.08);
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131019; --surface:#1D1826; --surface-2:#272131; --line:#352D42;
    --ink:#EEEAF4; --ink-2:#BDB4CC; --ink-3:#8D839E;
    --accent:#B592EA; --accent-soft:#2F2442; --on-accent:#17121F;
    --atk:#4CC39C; --atk-soft:#163129;
    --even:#E0A74A; --even-soft:#352A17;
    --def:#EE7A6E; --def-soft:#3A1E1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131019; --surface:#1D1826; --surface-2:#272131; --line:#352D42;
  --ink:#EEEAF4; --ink-2:#BDB4CC; --ink-3:#8D839E;
  --accent:#B592EA; --accent-soft:#2F2442; --on-accent:#17121F;
  --atk:#4CC39C; --atk-soft:#163129;
  --even:#E0A74A; --even-soft:#352A17;
  --def:#EE7A6E; --def-soft:#3A1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.2}
.brand .meta{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.brand .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px 8px 34px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-family:var(--f-body);color:var(--ink)}

/* groups & tiles */
.group{margin-top:22px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group-head h2{font-size:15px;font-weight:700;margin:0}
.group-head span{font-size:12px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.badge{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;line-height:1}
.st-攻め{--c:var(--atk);--cs:var(--atk-soft)}
.st-五分{--c:var(--even);--cs:var(--even-soft)}
.st-守り{--c:var(--def);--cs:var(--def-soft)}
.badge{background:var(--cs);color:var(--c);box-shadow:0 0 0 2px var(--c);overflow:hidden}
.badge img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.08)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.tile .row2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.wr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);position:relative;margin-top:4px}
.meter i{position:absolute;top:0;bottom:0;border-radius:2px}
.meter b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(19,16,25,.45);z-index:20}
.sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 0px) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.sheet-bar .t{flex:1;font-weight:700;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sheet-body{padding:18px 16px 0;display:grid;gap:18px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .badge{width:64px;height:64px;font-size:28px;grid-row:auto}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.hero .en{font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-2);margin-top:4px}
.hero .stats .wr{font-size:20px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .step{display:grid;gap:0;border-radius:8px;padding:6px 12px;background:var(--cs);border:1px solid var(--c);min-width:0}
.flow .step strong{color:var(--c);font-size:15px}
.flow .step small{font-size:12px;color:var(--ink-2);line-height:1.4}
.flow .arr{align-self:center;color:var(--ink-3);font-size:14px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card p{margin:0;font-size:14px}
.card.wide{grid-column:1/-1}
.cards.one{grid-template-columns:1fr}
.card.trap{border-color:var(--def);background:var(--def-soft)}
.card.trap h3{color:var(--def)}
.card.go{border-color:var(--atk);background:var(--atk-soft)}
.card.go h3{color:var(--atk)}
.win{margin:0;font-size:15px;font-weight:700;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px}
.goals{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.goals span{font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--accent-soft);color:var(--accent)}
.plays{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:8px;padding:9px 12px}
.play .if{font-size:13px;color:var(--ink-2)}
.play .if b{font-weight:500}
.play .then{display:flex;gap:8px;align-items:baseline;font-size:15px;font-weight:700;line-height:1.5}
.play .tg{flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--ps);color:var(--pc)}
.play.go{--pc:var(--atk);--ps:var(--atk-soft)}
.play.w{--pc:var(--even);--ps:var(--even-soft)}
.play.no{--pc:var(--def);--ps:var(--def-soft)}
.combo{display:grid;gap:6px}
.combo div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.combo b{color:var(--accent);margin-right:6px}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:2px 0}
.chain span{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:13px}
.chain em{font-style:normal;color:var(--ink-3);font-size:12px}
.chain-note{font-size:13px;color:var(--ink-2);margin-top:6px}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.key{position:relative;width:44px;height:44px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:16px;flex:none}
.key img{width:44px;height:44px;border-radius:8px;display:block}
.key i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:11px;line-height:1;background:var(--ink);color:var(--bg);border:2px solid var(--surface);border-radius:5px;padding:2px 4px}
.skill{grid-template-columns:44px minmax(0,1fr) !important}
.sname{font-weight:700;font-size:14px;margin-right:2px}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 9px;text-decoration:none;white-space:nowrap}
.vid:hover{filter:brightness(1.08)}
.skill .d{font-size:14px;margin:0}
.skill .c{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.skill .c b{color:var(--accent);font-size:12px;letter-spacing:.06em;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
.chip.p{background:var(--atk-soft);color:var(--atk);box-shadow:inset 0 0 0 1px var(--atk)}
.chip.q{background:var(--even-soft);color:var(--even);box-shadow:inset 0 0 0 1px var(--even)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none}
.links a:hover{border-color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:8px}
.navrow .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--ink-3)}
.skill{grid-template-columns:36px minmax(0,1fr)}
.skill-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.cd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);border-radius:6px;padding:2px 8px}
.cd small{font-family:var(--f-body);font-weight:500;color:var(--ink-3);margin-right:4px}
.form{font-size:11px;color:var(--ink-3)}
.skill-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:700px){.skill-grid{grid-template-columns:1fr}}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px}
.fig svg{display:block;width:100%;height:auto}
.fig-cap{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11px;color:var(--ink-3);padding:2px 4px 0;line-height:1.4}
.alt-toggle{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:1px 8px;color:var(--ink-2);white-space:nowrap}
.alt-toggle[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fig .ln{stroke:var(--ink-3)}
.fig .area{fill:var(--def);fill-opacity:.14;stroke:var(--def);stroke-opacity:.55;stroke-dasharray:4 3}
.fig .hit{fill:var(--def);fill-opacity:.55}
.fig .me{fill:var(--accent)}
.fig .foe{fill:var(--ink-2)}
.fig .t{fill:var(--ink-2);font-family:var(--f-body);font-size:10px}
.fig .tm{fill:var(--ink-3);font-family:var(--f-mono);font-size:8.5px}
.fig .mq{fill:var(--accent);font-family:var(--f-body);font-size:8.5px}
.fig .aura{fill:none;stroke:var(--even);stroke-width:2}
.fig .trail{stroke:var(--def);stroke-width:2;stroke-dasharray:3 3;fill:none}
@media (prefers-reduced-motion:reduce){.fig .anim{display:none}}
table.gl{width:100%;border-collapse:collapse;font-size:14px}
table.gl td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.gl td:first-child{font-weight:700;white-space:nowrap;width:1%;padding-right:14px}
.vp{position:fixed;z-index:1000;left:16px;bottom:16px;width:min(520px,calc(100vw - 32px));background:#0b1220;color:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
.vp[hidden]{display:none}
.vp-bar{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;font-size:13px}
.vp-t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-keys{display:flex;gap:4px}
.vp-keys button,.vp-x{font:inherit;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:6px;min-width:28px;height:28px;cursor:pointer}
.vp-keys button[aria-pressed="true"]{background:#10b981;color:#062b1f}
.vp-x{font-size:16px}
.vp video[hidden]{display:none}
.vp video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.vp-desc{background:var(--surface,#fff);color:var(--ink,#111);max-height:34vh;overflow-y:auto;padding:10px 12px;font-size:14px;line-height:1.7}
.vp-desc[hidden]{display:none}
.vp-desc p{margin:0 0 8px}
.vp-desc p:last-child{margin-bottom:0}
@media (max-width:900px){.vp-desc{max-height:30vh}}
.vp-err{margin:0;padding:10px 12px;font-size:13px;line-height:1.6}
.vp-err a{color:#6ee7b7}
@media (max-width:900px){.vp{right:8px;left:8px;bottom:8px;width:auto;max-width:560px;margin:0 auto}}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.csw{border:1px solid var(--line);border-left:4px solid #d97706;border-radius:8px;padding:6px 10px;background:var(--surface)}
.csw b{font-size:12px;color:#b45309;margin-right:4px}
.csw .t1{margin:0 0 4px;font-size:14px;line-height:1.6;font-weight:600;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.csw .t1 b{display:inline-block;margin-right:6px}
.csw ul{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px}
.csw li{font-size:14px;line-height:1.55;font-weight:600}
.csw li i{font-style:normal;display:inline-block;min-width:18px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:#b45309;border-radius:4px;padding:0 4px;margin-right:6px;vertical-align:1px}
.csw li small{font-weight:500;color:var(--muted,#6b7280);margin-left:6px;white-space:nowrap}
.fv{display:grid;gap:14px}
.fv-col{display:grid;gap:14px;align-content:start;min-width:0}
.fv .sec-label,.fv .lab{margin-bottom:6px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip button{display:flex;align-items:center;gap:6px;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px 4px 4px;cursor:pointer;color:var(--ink)}
.strip button:hover{border-color:var(--accent)}
.strip img{width:28px;height:28px;border-radius:5px;display:block}
.strip b{font-size:12px}
.strip small{font-size:11px;color:var(--ink-3,#6b7280);white-space:nowrap}
.dhead{display:flex;align-items:center;gap:10px;margin:6px 0 -4px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3,#6b7280)}
.dhead::before,.dhead::after{content:"";flex:1;height:1px;background:var(--line)}
@media (min-width:1200px){
  .sheet{width:min(1360px,96vw)}
  .fv{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);align-items:start;gap:16px}
  .fv .hero h2{font-size:24px}
  .fv .play{padding:6px 10px}
  .fv .play .then{font-size:14px}
  .fv .card p,.fv .card li span,.fv .csw li,.fv .csw .t1,.fv .buy,.fv .vs li span{font-size:13px;line-height:1.55}
  .fv .play .if{font-size:12px}
  .fv-col > *{margin-bottom:12px}
  .fv .card{padding:10px 12px}
  .fv .vs li{padding-top:7px;padding-bottom:7px}
}
@media (min-width:1200px){
  .fv{display:block;columns:3;column-gap:16px}
  .fv-col{display:contents}
  .fv-col > *{break-inside:avoid;margin:0 0 14px;display:block}
  .fv-col > .hero{display:grid}
  .fv-col > .cards.one{display:grid}
}
.gwm{font-size:10px;font-weight:700;color:#fff;background:#c62828;border-radius:3px;padding:0 4px;vertical-align:2px}
.buy{display:flex;gap:8px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-left:4px solid #2563eb;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.55}
.buy b{flex:none;color:#fff;background:#2563eb;border-radius:4px;padding:1px 7px;font-size:12px}
.gw{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:#fdecec;border:1px solid #d33;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5;color:#111}
.gw b{flex:none;color:#fff;background:#c62828;border-radius:4px;padding:1px 7px;font-size:12px}
.gw small{color:#555}
.tag.gwt{background:#c62828;color:#fff}
@media (max-width:700px){
  .sheet-body,.body{grid-template-columns:minmax(0,1fr)}
  .fv{display:flex;flex-direction:column;gap:10px;min-width:0}
  .fv-col > *{min-width:0;max-width:100%}
  .fv-col{display:contents}
  .fv .hero{order:1;gap:10px}
  .fv .gw{order:2}
  .fv .o-flow{order:3}
  .fv .memo{order:4}
  .fv .o-win,.fv .key-card{order:5}
  .fv .o-strip{order:6}
  .fv .csw{order:7}

(function(){

C.forEach(c => { c._k = norm([c.jp, c.official || '', c.en, c.slug].join('|')); });
function matches(c){

const icon = (slug, k) => (IMG[slug] && IMG[slug][k]) || '';
const videoURL = (c, k) => `https://lol.dyn.riotcdn.net/x/videos/champion-abilities/${c.key4}/ability_${c.key4}_${k}1.mp4`;
const TIERS = {hard:'苦手対面（勝率47%未満）',even:'互角対面（47〜51%）',fav:'有利対面①（51〜54%）',fav2:'有利対面②（54%以上）'};

const csCD = cd => { if (!cd || !/^[\d.\s\/]+$/.test(cd)) return ''; const a = cd.split('/').map(s=>s.trim()).filter(Boolean); const last = a[a.length-1]; if (a.length > 1 && +last === 0) return 'CD ' + a[0] + '秒→最大で常時ON'; return 'CD ' + (a.length > 1 && a[0] !== last ? a[0] + '→' + last : a[0]) + '秒'; };
const buyHTML = c => c.buy ? `<div class="buy"><b>対策アイテム</b><span>${esc(c.buy)}</span></div>` : '';
const gwHTML = c => c.gw ? `<div class="gw"><b>重傷${c.gw.lv === '必須級' ? '必須級' : '推奨'}</b><span>${esc(c.gw.why)}</span><small>（重傷＝回復量を減らす効果。ムンドならブランブル ベストなどで付けられます）</small></div>` : '';
const scaleHTML = c => { const s = c.sc; if (!s) return '';

    ${['序盤','中盤','終盤'].map((t,i)=>`<text x="${xs[i]}" y="${H-2}" text-anchor="middle" class="scl-x">${t}・${lab([s.e,s.m,s.l][i])}</text>`).join('')}
  </svg><p class="scl-n">${esc(s.why)}</p></section>`; };
const csHTML = c => ((c.cs && c.cs.length) || c.tip1) ? `<section class="csw">${c.tip1 ? `<p class="t1"><b>ひとこと</b>${esc(c.tip1)}</p>` : ''}${c.cs && c.cs.length ? `<b>CSで近づく時の注意</b>` : ''}<ul>${(c.cs||[]).map(x => { const s = c.skills[x.k] || {}; const cd = csCD(s.cd); return `<li><i>${esc(x.k)}</i>${esc(x.t)}${cd ? `<small>${cd}</small>` : ''}</li>`; }).join('')}</ul></section>` : '';
function stripHTML(c, iconFn, ids){
  return `<div class="strip">${['P','Q','W','E','R'].map((k,i) => { const s = c.skills[k] || {}; const cd = csCD(s.cd); const im = iconFn(k);
    return `<button type="button" data-jump="${i}" title="${k}の詳細へ">${im ? `<img src="${im}" alt="">` : ''}<b>${k}</b>${cd ? `<small>${cd.replace('CD ','').replace('秒→最大で常時ON','→常時').replace('秒','')}</small>` : ''}</button>`; }).join('')}</div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (!b) return;
  const rows = document.querySelectorAll('#sheet .skills > .skill, #sheet .skills > .sk'); const r = rows[+b.dataset.jump]; if (r) r.scrollIntoView({behavior:'smooth', block:'start'}); });
const state = {q:'', f:'all', sort:'group'};
try { const s = JSON.parse(localStorage.getItem('mundo-codex') || '{}'); if (s.f) state.f = s.f; if (s.sort) state.sort = s.sort; } catch(e) {}
function save(){ try { localStorage.setItem('mundo-codex', JSON.stringify({f:state.f, sort:state.sort})); } catch(e) {} }

const first = c => c.stance[0].s;
const mono = c => c.jp.replace(/^[・ー＝]/,'').charAt(0);

function meter(wr){
  const lo = 38, hi = 68;
  const pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const a = pos(50), b = pos(wr);
  const left = Math.min(a,b), w = Math.abs(b-a);
  const col = wr >= 51 ? 'var(--atk)' : wr < 47 ? 'var(--def)' : 'var(--even)';
  return `<span class="meter" aria-hidden="true"><i style="left:${left}%;width:${Math.max(w,1.5)}%;background:${col}"></i><b style="left:${a}%"></b></span>`;
}
function tile(c){
  const st = first(c);
  return `<button class="tile st-${st}" type="button" data-slug="${c.slug}" aria-label="${esc(c.jp)} ムンド勝率${c.wr}% 序盤${st}">
    <span class="badge" aria-hidden="true">${icon(c.slug,"c") ? `<img src="${icon(c.slug,"c")}" alt="" loading="lazy">` : esc(mono(c))}</span>
    <span class="nm">${esc(c.jp)}${c.gw ? ' <span class="gwm" title="重傷推奨">重傷</span>' : ''}</span>
    <span class="row2"><span class="wr">${c.wr.toFixed(1)}%</span><span>${st}</span>${c.few ? '<span class="tag">少数</span>' : ''}</span>
    ${meter(c.wr)}
  </button>`;
}
function renderList(){
  let rows = C.filter(matches);
  const el = $('#list');
  if (!rows.length){ el.innerHTML = '<p class="empty">該当するチャンピオンがいません。検索語か絞り込みを変えてください。</p>'; return; }
  if (state.sort === 'group'){
    el.innerHTML = Object.keys(TIERS).map(t => {
      const r = rows.filter(c => c.tier === t);
      if (!r.length) return '';
      return `<section class="group"><div class="group-head"><h2>${TIERS[t]}</h2><span>${r.length}体</span></div><div class="grid">${r.map(tile).join('')}</div></section>`;
    }).join('');
  } else {
    rows = rows.slice();
    if (state.sort === 'wr-asc') rows.sort((a,b)=>a.wr-b.wr);
    if (state.sort === 'wr-desc') rows.sort((a,b)=>b.wr-a.wr);
    if (state.sort === 'kana') rows.sort((a,b)=>a.jp.localeCompare(b.jp,'ja'));
    el.innerHTML = `<section class="group"><div class="group-head"><h2>${rows.length}体</h2></div><div class="grid">${rows.map(tile).join('')}</div></section>`;
  }
}

function chainHTML(text){
  const sentences = text.split('。').map(s=>s.trim()).filter(Boolean);
  let out = '', notes = [];
  sentences.forEach(s => {
    if (s.includes(' → ')){
      const body = s.replace(/、?という[^、]*$/,'');
      const steps = body.split(' → ');
      out += `<div class="chain">${steps.map((x,i)=>`${i?'<em>→</em>':''}<span>${esc(x)}</span>`).join('')}</div>`;
    } else notes.push(s + '。');
  });
  if (notes.length) out += `<p class="chain-note">${esc(notes.join(''))}</p>`;
  return out || `<p>${esc(text)}</p>`;
}
function skillChips(s){
  const t = s.d + s.c; const out = [];
  if (/パッシブ[^。]{0,16}防げ(ます|る)/.test(t)) out.push('<span class="chip p">ムンドPで無効化できる</span>');
  if (/未確認|推定/.test(t)) out.push('<span class="chip q">要検証</span>');
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}
const PLAY_TAG = {go:'打ち返す', w:'避ける・受ける', no:'付き合わない'};
const SKILL_NAME = {P:'パッシブ',Q:'Q',W:'W',E:'E',R:'R（アルティメット）'};

/* ---------- 模式アニメーション ---------- */
const LOOP = 2.6;
const SHAPE_JA = {line:'直線の飛び道具',cone:'前方の扇形',circle:'指定地点の範囲',self:'自分の周囲の範囲',dash:'移動（ダッシュ・跳躍）',unit:'対象指定',buff:'自己強化・次の通常攻撃',global:'マップ全域',passive:'常時効果'};
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const f3 = v => clamp(v,0,1).toFixed(3);
function anim(attr, vals, keys){
  return `<animate attributeName="${attr}" values="${vals.join(';')}" keyTimes="${keys.map(f3).join(';')}" dur="${LOOP}s" repeatCount="indefinite"/>`;
}
function num(v){ return (typeof v === 'number' && isFinite(v) && v > 0) ? v : null; }
function fig(g){
  const W = 360, x0 = 22, L = 318;
  const flags = [];
  const shape = g.shape || 'buff';
  let range = num(g.range), width = num(g.width), radius = num(g.radius), angle = num(g.angle), speed = num(g.speed);
  const cast = num(g.cast) ? clamp(g.cast, 0, 0.9) : 0;
  const c = cast || 0.12, k0 = c / LOOP;
  const parts = [SHAPE_JA[shape] || ''];
  if (num(g.range) && shape !== 'self') parts.push(`射程 ${Math.round(g.range)}`);
  if (num(g.width)) parts.push(`幅 ${Math.round(g.width)}`);
  if (num(g.radius)) parts.push(`半径 ${Math.round(g.radius)}`);
  if (num(g.angle)) parts.push(`角度 ${g.angle}°`);
  if (num(g.cast)) parts.push(`詠唱 ${+g.cast.toFixed(2)}秒`);

  /* 範囲を持たないスキル：相手と効果の表示だけ */
  if (shape === 'buff' || shape === 'passive' || shape === 'global'){
    const H = 58, y = 29, r = 8;
    const txt = {buff:'自分を強化する（当たり判定の範囲なし）', passive:'常に働く効果（当たり判定の範囲なし）', global:'マップのどこにでも届く'}[shape];
    const ring = shape === 'global'
      ? `<circle cx="${x0}" cy="${y}" class="aura">${anim('r',[r, r, 360, 360],[0,0.05,0.75,1])}${anim('opacity',[0,1,0,0],[0,0.05,0.75,1])}</circle>`
      : `<circle cx="${x0}" cy="${y}" class="aura">${anim('r',[r+1, r+1, r+14, r+1],[0,k0,0.55,1])}${anim('opacity',[0,1,0,0],[0,k0,0.55,1])}</circle>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SHAPE_JA[shape]}">
      <circle cx="${x0}" cy="${y}" r="${r + 3}" class="aura" opacity=".45"/>
      <circle cx="${x0}" cy="${y}" r="${r}" class="foe"/>
      <text x="${x0 + r + 12}" y="${y + 4}" class="t">${txt}</text><g class="anim">${ring}</g></svg>`;
    return {svg, cap: parts.join(' · ')};
  }

  let wall = false;
  if (shape === 'line'){ if (!range){ range = 600; flags.push('射程'); } if (!width){ width = 80; flags.push('幅'); } }
  if (shape === 'cone'){ if (!range){ range = 400; flags.push('射程'); } if (!angle){ angle = 60; flags.push('角度'); } }
  if (shape === 'circle'){
    if (!range){ range = 300; flags.push('射程'); }
    if (!radius){ if (width){ wall = true; } else { radius = 150; flags.push('範囲'); } }
  }
  if (shape === 'self' && !radius){ if (range){ radius = range; } else { radius = 300; flags.push('範囲'); } }
  if (shape === 'dash' && !range){ range = 400; flags.push('距離'); }
  if (shape === 'unit' && !range){ range = 500; flags.push('射程'); }

  const reach = {line:range, cone:range, circle:range + (radius || 0), self:radius, dash:range + (radius || 0), unit:range}[shape];
  const clipped = reach > 2000;
  const maxU = clamp(reach * 1.15, 700, 2000);
  const halfU = {line:width / 2, cone:range * Math.sin(Math.min(angle, 180) * Math.PI / 360), circle:wall ? width / 2 : radius, self:radius, dash:radius || 0, unit:0}[shape] || 0;
  const s = Math.min(L / maxU, halfU > 0 ? 72 / halfU : Infinity);
  const shownU = L / s;
  const half = Math.max(halfU * s, 20);
  const y = 6 + half, ry = y + half + 8, H = ry + 17;
  const X = u => x0 + Math.min(u, shownU) * s;
  const foeR = 7, meR = 8;
  let mx;
  if (shape === 'line' || shape === 'cone' || shape === 'unit') mx = Math.min(range * 0.88, shownU * 0.9);
  else if (shape === 'circle') mx = Math.min(range, shownU * 0.9);
  else if (shape === 'self') mx = radius * 0.7;
  else mx = Math.min(range + 90, shownU * 0.95);
  const MX = X(mx);
  let st = '', an = '';
  if (cast) an += `<circle cx="${x0}" cy="${y}" class="aura">${anim('opacity',[1,1,0,0],[0,k0,k0+0.01,1])}${anim('r',[foeR+1,foeR+7,foeR+7,foeR+1],[0,k0,k0+0.01,1])}</circle>`;
  const flash = (k, cx) => `<circle cx="${cx}" cy="${y}" r="${meR + 4}" class="hit">${anim('opacity',[0,0,0.9,0,0],[0,k,k+0.04,k+0.22,1])}</circle>`;

  if (shape === 'line'){
    const w = Math.max(3, width * s), xe = X(range);
    st += `<rect x="${x0}" y="${y - w/2}" width="${xe - x0}" height="${w}" class="area"/>`;
    const t = clamp(range / (speed || 1800), 0.25, 1.3), k1 = (c + t) / LOOP, pw = clamp(w, 5, 16);
    an += `<rect y="${y - w/2}" width="${pw}" height="${w}" class="hit" rx="2">${anim('x',[x0, x0, xe - pw, xe - pw],[0,k0,k1,1])}${anim('opacity',[0,1,1,0,0],[0,k0,k1,k1+0.02,1])}</rect>`;
    if (mx <= range) an += flash(k0 + (k1 - k0) * (mx / range), MX);
  } else if (shape === 'cone'){
    const R = range * s, a = Math.min(angle, 180) * Math.PI / 360;
    const p = `M${x0} ${y} L${x0 + R*Math.cos(a)} ${y - R*Math.sin(a)} A${R} ${R} 0 0 1 ${x0 + R*Math.cos(a)} ${y + R*Math.sin(a)} Z`;
    st += `<path d="${p}" class="area"/>`;
    an += `<path d="${p}" class="hit">${anim('opacity',[0,0,0.7,0,0],[0,k0,k0+0.06,k0+0.3,1])}</path>`;
  } else if (shape === 'circle'){
    const cx = X(range);
    st += `<line x1="${x0}" y1="${y}" x2="${cx}" y2="${y}" class="trail"/>`;
    if (wall){
      const h = width * s;
      st += `<rect x="${cx - 3}" y="${y - h/2}" width="6" height="${h}" class="area"/>`;
      an += `<rect x="${cx - 3}" y="${y - h/2}" width="6" height="${h}" class="hit">${anim('opacity',[0,0,0.8,0.8,0],[0,k0+0.08,k0+0.12,0.8,1])}</rect>`;
    } else {
      const r = radius * s;
      st += `<circle cx="${cx}" cy="${y}" r="${r}" class="area"/>`;
      an += `<circle cx="${cx}" cy="${y}" r="${r}" class="hit">${anim('opacity',[0,0,0.65,0,0],[0,k0+0.1,k0+0.16,k0+0.4,1])}</circle>`;
    }
  } else if (shape === 'self'){
    const r = radius * s;
    st += `<circle cx="${x0}" cy="${y}" r="${r}" class="area"/>`;
    an += `<circle cx="${x0}" cy="${y}" class="hit">${anim('r',[0,0,r,r],[0,k0,k0+0.14,1])}${anim('opacity',[0,0.7,0.6,0,0],[0,k0,k0+0.14,k0+0.4,1])}</circle>`;
  } else if (shape === 'dash'){
    const xe = X(range);
    st += `<line x1="${x0}" y1="${y}" x2="${xe}" y2="${y}" class="trail"/><path d="M${xe} ${y} l-6 -4 v8 z" class="foe" opacity=".6"/>`;
    if (radius) st += `<circle cx="${xe}" cy="${y}" r="${radius * s}" class="area"/>`;
    const k1 = k0 + 0.18;
    an += `<circle cy="${y}" r="${foeR}" class="foe">${anim('cx',[x0, x0, xe, xe],[0,k0,k1,1])}${anim('opacity',[0,0.9,0.9,0.9,0],[0,k0,k1,0.85,1])}</circle>`;
    if (radius) an += `<circle cx="${xe}" cy="${y}" r="${radius * s}" class="hit">${anim('opacity',[0,0,0.6,0,0],[0,k1,k1+0.04,k1+0.3,1])}</circle>`;
  } else if (shape === 'unit'){
    const xr = X(range);
    st += `<line x1="${xr}" y1="${y - 18}" x2="${xr}" y2="${y + 18}" class="trail"/>`;
    an += `<line x1="${x0}" y1="${y}" y2="${y}" class="trail" style="stroke-dasharray:none">${anim('x2',[x0, x0, MX, MX],[0,k0,k0+0.12,1])}${anim('opacity',[0,1,1,0,0],[0,k0,k0+0.3,k0+0.34,1])}</line>`;
    an += flash(k0 + 0.12, MX);
  }
  let ruler = `<line x1="${x0}" y1="${ry}" x2="${x0 + L}" y2="${ry}" class="ln"/>`;
  const step = shownU > 1600 ? 500 : 250;
  for (let u = 0; u <= shownU; u += step){
    const xx = X(u), big = u % (step * 2) === 0;
    ruler += `<line x1="${xx}" y1="${ry}" x2="${xx}" y2="${ry + (big ? 5 : 3)}" class="ln"/>`;
    if (big) ruler += `<text x="${xx}" y="${ry + 13}" text-anchor="middle" class="tm">${u}</text>`;
  }
  if (1050 <= shownU){
    const qx = X(1050);
    ruler += `<path d="M${qx} ${ry - 1} l-3.5 -6 h7 z" class="me"/>` + (Math.abs(qx - MX) > 34 ? `<text x="${qx}" y="${ry - 9}" text-anchor="middle" class="mq">ムンドQ</text>` : '');
  }
  if (clipped) ruler += `<text x="${x0 + L}" y="${ry - 4}" text-anchor="end" class="tm">→ ${Math.round(reach)}まで届く</text>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SHAPE_JA[shape]}の模式図">
    ${ruler}${st}
    <circle cx="${MX}" cy="${y}" r="${meR}" class="me"/><text x="${MX}" y="${y + meR + 11}" text-anchor="middle" class="t">ムンド</text>
    <circle cx="${x0}" cy="${y}" r="${foeR}" class="foe"/><text x="${x0}" y="${y + foeR + 11}" text-anchor="middle" class="t">相手</text>
    <g class="anim">${an}</g></svg>`;
  const cap = parts.join(' · ') + (flags.length ? `（${flags.join('・')}は公式表記なしのため目安）` : '');
  return {svg, cap};
}

  box.querySelector('.vp-x').addEventListener('click', hide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden){ hide(); e.stopImmediatePropagation(); } }, true);
  return {show, hide};
})();
document.addEventListener('click', e => {
  if (!VP_INLINE) return;
  const a = e.target.closest('a.vid'); if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault(); e.stopImmediatePropagation(); vp.show(a);
}, true);
