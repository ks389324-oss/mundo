<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ドクター・ムンドでTOPに立った時の対面55体の攻略帳（パッチ26.19）">
<meta name="theme-color" content="#6A3E9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ムンド対面帳">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>ムンドTOP対面帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F0F5; --surface:#FFFFFF; --surface-2:#E9E5EF; --line:#D6D0DF;
  --ink:#1D1826; --ink-2:#4E4660; --ink-3:#7C7390;
  --accent:#6A3E9E; --accent-soft:#E6DCF3; --on-accent:#FFFFFF;
  --atk:#1E7F63; --atk-soft:#D9EFE7;
  --even:#A86A12; --even-soft:#F5E7CF;
  --def:#B8352B; --def-soft:#F6DDDA;
  --shadow:0 1px 2px rgba(29,24,38,.06),0 6px 20px rgba(29,24,38,.08);
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131019; --surface:#1D1826; --surface-2:#272131; --line:#352D42;
    --ink:#EEEAF4; --ink-2:#BDB4CC; --ink-3:#8D839E;
    --accent:#B592EA; --accent-soft:#2F2442; --on-accent:#17121F;
    --atk:#4CC39C; --atk-soft:#163129;
    --even:#E0A74A; --even-soft:#352A17;
    --def:#EE7A6E; --def-soft:#3A1E1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131019; --surface:#1D1826; --surface-2:#272131; --line:#352D42;
  --ink:#EEEAF4; --ink-2:#BDB4CC; --ink-3:#8D839E;
  --accent:#B592EA; --accent-soft:#2F2442; --on-accent:#17121F;
  --atk:#4CC39C; --atk-soft:#163129;
  --even:#E0A74A; --even-soft:#352A17;
  --def:#EE7A6E; --def-soft:#3A1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.2}
.brand .meta{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.brand .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px 8px 34px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-family:var(--f-body);color:var(--ink)}

/* groups & tiles */
.group{margin-top:22px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.group-head h2{font-size:15px;font-weight:700;margin:0}
.group-head span{font-size:12px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.badge{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;line-height:1}
.st-攻め{--c:var(--atk);--cs:var(--atk-soft)}
.st-五分{--c:var(--even);--cs:var(--even-soft)}
.st-守り{--c:var(--def);--cs:var(--def-soft)}
.badge{background:var(--cs);color:var(--c);box-shadow:0 0 0 2px var(--c);overflow:hidden}
.badge img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.08)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.tile .row2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.wr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);position:relative;margin-top:4px}
.meter i{position:absolute;top:0;bottom:0;border-radius:2px}
.meter b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(19,16,25,.45);z-index:20}
.sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 0px) 0 calc(env(safe-area-inset-bottom,0px) + 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.sheet-bar .t{flex:1;font-weight:700;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sheet-body{padding:18px 16px 0;display:grid;gap:18px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .badge{width:64px;height:64px;font-size:28px;grid-row:auto}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.hero .en{font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-2);margin-top:4px}
.hero .stats .wr{font-size:20px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .step{display:grid;gap:0;border-radius:8px;padding:6px 12px;background:var(--cs);border:1px solid var(--c);min-width:0}
.flow .step strong{color:var(--c);font-size:15px}
.flow .step small{font-size:12px;color:var(--ink-2);line-height:1.4}
.flow .arr{align-self:center;color:var(--ink-3);font-size:14px}
.sec-label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card p{margin:0;font-size:14px}
.card.wide{grid-column:1/-1}
.card.trap{border-color:var(--def);background:var(--def-soft)}
.card.trap h3{color:var(--def)}
.card.go{border-color:var(--atk);background:var(--atk-soft)}
.card.go h3{color:var(--atk)}
.win{margin:0;font-size:15px;font-weight:700;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px}
.goals{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.goals span{font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--accent-soft);color:var(--accent)}
.plays{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.play{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:8px;padding:9px 12px}
.play .if{font-size:13px;color:var(--ink-2)}
.play .if b{font-weight:500}
.play .then{display:flex;gap:8px;align-items:baseline;font-size:15px;font-weight:700;line-height:1.5}
.play .tg{flex:none;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--ps);color:var(--pc)}
.play.go{--pc:var(--atk);--ps:var(--atk-soft)}
.play.w{--pc:var(--even);--ps:var(--even-soft)}
.play.no{--pc:var(--def);--ps:var(--def-soft)}
.combo{display:grid;gap:6px}
.combo div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.combo b{color:var(--accent);margin-right:6px}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:2px 0}
.chain span{background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:13px}
.chain em{font-style:normal;color:var(--ink-3);font-size:12px}
.chain-note{font-size:13px;color:var(--ink-2);margin-top:6px}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:36px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.key{position:relative;width:44px;height:44px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:16px;flex:none}
.key img{width:44px;height:44px;border-radius:8px;display:block}
.key i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:11px;line-height:1;background:var(--ink);color:var(--bg);border:2px solid var(--surface);border-radius:5px;padding:2px 4px}
.skill{grid-template-columns:44px minmax(0,1fr) !important}
.sname{font-weight:700;font-size:14px;margin-right:2px}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 9px;text-decoration:none;white-space:nowrap}
.vid:hover{filter:brightness(1.08)}
.skill .d{font-size:14px;margin:0}
.skill .c{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.skill .c b{color:var(--accent);font-size:12px;letter-spacing:.06em;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
.chip.p{background:var(--atk-soft);color:var(--atk);box-shadow:inset 0 0 0 1px var(--atk)}
.chip.q{background:var(--even-soft);color:var(--even);box-shadow:inset 0 0 0 1px var(--even)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none}
.links a:hover{border-color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:8px}
.navrow .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--ink-3)}
.skill{grid-template-columns:36px minmax(0,1fr)}
.skill-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.cd{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);border-radius:6px;padding:2px 8px}
.cd small{font-family:var(--f-body);font-weight:500;color:var(--ink-3);margin-right:4px}
.form{font-size:11px;color:var(--ink-3)}
.skill-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:700px){.skill-grid{grid-template-columns:1fr}}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px}
.fig svg{display:block;width:100%;height:auto}
.fig-cap{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11px;color:var(--ink-3);padding:2px 4px 0;line-height:1.4}
.alt-toggle{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:1px 8px;color:var(--ink-2);white-space:nowrap}
.alt-toggle[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fig .ln{stroke:var(--ink-3)}
.fig .area{fill:var(--def);fill-opacity:.14;stroke:var(--def);stroke-opacity:.55;stroke-dasharray:4 3}
.fig .hit{fill:var(--def);fill-opacity:.55}
.fig .me{fill:var(--accent)}
.fig .foe{fill:var(--ink-2)}
.fig .t{fill:var(--ink-2);font-family:var(--f-body);font-size:10px}
.fig .tm{fill:var(--ink-3);font-family:var(--f-mono);font-size:8.5px}
.fig .mq{fill:var(--accent);font-family:var(--f-body);font-size:8.5px}
.fig .aura{fill:none;stroke:var(--even);stroke-width:2}
.fig .trail{stroke:var(--def);stroke-width:2;stroke-dasharray:3 3;fill:none}
@media (prefers-reduced-motion:reduce){.fig .anim{display:none}}
table.gl{width:100%;border-collapse:collapse;font-size:14px}
table.gl td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.gl td:first-child{font-weight:700;white-space:nowrap;width:1%;padding-right:14px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ムンドTOP対面帳</h1>
      <span class="meta">パッチ26.19 · エメラルド+ · 55体</span>
      <span class="spacer"></span>
      <button class="btn" id="basicsBtn" type="button">ムンドの基本・用語</button>
    </div>
    <div class="controls">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="名前で検索（カタカナ・英語）" autocomplete="off">
      </label>
      <div class="seg" role="group" aria-label="序盤の対応方針で絞り込み" id="seg">
        <button type="button" data-f="all" aria-pressed="true">すべて</button>
        <button type="button" data-f="攻め" aria-pressed="false">攻め</button>
        <button type="button" data-f="五分" aria-pressed="false">五分</button>
        <button type="button" data-f="守り" aria-pressed="false">守り</button>
      </div>
      <select class="sort" id="sort" aria-label="並び順">
        <option value="group">勝率帯ごと</option>
        <option value="wr-asc">勝率が低い順</option>
        <option value="wr-desc">勝率が高い順</option>
        <option value="kana">名前順</option>
      </select>
    </div>
  </header>

  <div class="legend" aria-label="凡例">
    <span><i class="dot st-攻め"></i>攻め：Qで削り主導権を取る</span>
    <span><i class="dot st-五分"></i>五分：合図が来た時だけ殴る</span>
    <span><i class="dot st-守り"></i>守り：フリーズして最低限のCS</span>
    <span>アイコンの色＝序盤の方針 ／ バー＝ムンド勝率（中央線が50%）</span>
  </div>

  <main id="list"></main>
</div>

<script id="data" type="application/json">{"champs": [{"jp": "サイラス", "en": "Sylas", "wr": 40.0, "games": 110, "few": true, "tier": "hard", "slug": "sylas", "stance": [{"s": "守り", "when": "全時間帯。魔法防御が揃うまで殴り合わない"}], "skills": {"P": {"d": "スキルを使うと、次の通常攻撃が鎖を振り回す範囲攻撃になります（複数回分溜まります）。", "c": "サイラスがスキルを使った直後は近接距離に留まらず、一歩下がって強化攻撃を空振りさせます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": 300, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "2本の鎖が「X字」に交差するよう地面に叩きつけ、少し遅れて交点が爆発します。", "c": "鎖の交点が自分の足元に来る位置取りを避けます。交点は一瞬遅れて爆発するため、見てから横に一歩ずれれば間に合います。", "cd": "10 / 9 / 8 / 7 / 6", "g": {"shape": "circle", "range": 775, "width": null, "radius": 200, "angle": null, "speed": null, "cast": 0.4}}, "W": {"d": "対象を指定して飛びかかり、斬りつけて回復します。自分のHPが低いほど回復量が増えます。", "c": "対象指定のため避けられません。HPの減ったサイラスを深追いすると、Wの大回復で逆転されます。「あと少し」の場面ほど追わない判断が重要です。", "cd": "12 / 10.5 / 9 / 7.5 / 6", "g": {"shape": "unit", "range": 400, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "1段目は短いダッシュ、2段目は鎖を直線に投げ、当たった相手へ飛びついてノックアップします。鎖は最初に当たった敵で止まります。", "c": "常にミニオンの後ろに立ち、鎖をミニオンに当てさせます。当たってもノックアップはパッシブで1回防げます。", "cd": "13 / 12 / 11 / 10 / 9", "g": {"shape": "dash", "range": 400, "width": null, "radius": null, "angle": null, "speed": 1450, "cast": 0}, "alt": {"label": "2段目（鎖投げ）", "cd": null, "g": {"shape": "line", "range": 950, "width": 120, "radius": null, "angle": null, "speed": null, "cast": null}}}, "R": {"d": "敵のRを奪って使います。ムンドのRを奪われると、サイラスが大回復と加速を得ます。", "c": "サイラスがRを温存している間は、こちらもRを使った全力戦闘を避けます。", "cd": "80 / 55 / 30", "g": {"shape": "unit", "range": 950, "width": null, "radius": null, "angle": null, "speed": 2200, "cast": 0.25}}}, "core": "スキル後の強化通常攻撃（P）と、HPが減るほど回復量が増えるWです。瀕死からの逆転が最大の武器です。", "plan": "E1段目で近づく → E2段目の鎖を当てて飛びつく → P強化攻撃とQで削る → HPが減ったらWで回復しながら仕留める、という流れです。", "trap": "瀕死のサイラスはWで一気に回復します。自分のHPが半分を切った状態で追撃すると、逆に倒されます。", "go": "E（飛びつき）を使った直後です。Eは待ち時間が長く、この間サイラスは接近手段を失います。ミニオンの後ろからQを当てて削ります。", "win": "魔法防御が揃う中盤以降に、ミニオンの後ろからQで削り続けてCS差で勝ちます。キルを狙うのは、サイラスがEを使った後か味方ジャングルがいる時だけです。", "goal": ["Eを空振りさせる", "瀕死のサイラスを追わない"], "plays": [["E2段目の鎖をミニオンで防いだ／Eを使い切った", "前に出てAA→E、Qを当てて下がる", "go"], ["スキルを使った直後（強化攻撃が溜まっている）", "一歩下がって強化攻撃を空振りさせる", "no"], ["Wで飛びかかってきた", "Wを押して受け、再発動で回復", "w"], ["自分のHPが半分以下でサイラスが瀕死", "追わない。Wの大回復で逆転される", "no"]], "key4": "0517", "official": "サイラス", "snames": {"P": "ペトリサイトバースト", "Q": "鎖の鞭", "W": "王殺し", "E": "逃亡/拉致", "R": "乗っ取り"}}, {"jp": "ワーウィック", "en": "Warwick", "wr": 42.3, "games": 222, "few": false, "tier": "hard", "slug": "warwick", "stance": [{"s": "守り", "when": "ブランブル ベスト購入まで殴り合わない"}], "skills": {"P": {"d": "通常攻撃に追加ダメージが付き、自分のHPが半分を切ると回復も付き、さらに減ると回復量が増えます。", "c": "HPの減ったワーウィックと長く殴り合うほど相手が回復します。短いトレードで離れるか、重傷効果（ブランブル ベスト）を持ってから戦います。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "短く押すと噛みついて回復、長押しすると相手に張り付き、相手が移動やフラッシュをしても追いかけて着地します。", "c": "張り付かれている間のフラッシュは無駄になります（一緒に付いてきます）。フラッシュは張り付きが終わってから使います。", "cd": "8 / 7.5 / 7 / 6.5 / 6", "g": {"shape": "unit", "range": 365, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "受動でHPが半分未満の敵に対して攻撃速度が上がり、HPが半分を切った敵チャンピオンの位置がマップ全体で分かり、そこへ向かう時に加速します。発動すると、近くで最も近い敵チャンピオンをHPに関係なく8秒間マークし、同じ効果を得ます。", "c": "HPが半分を切った時点で安全ではなくなります。半分前後で帰還を判断します。", "cd": "80 / 70 / 60 / 50 / 40", "g": {"shape": "global", "range": null, "width": null, "radius": 4000, "angle": null, "speed": null, "cast": 0.5}}, "E": {"d": "一定時間ダメージを大きく軽減し、終了時（または再発動時）に遠吠えで周囲の敵を恐怖状態にします（勝手に彼から離れる方向へ歩きます）。", "c": "E発動中は火力が通りません。恐怖（1秒）はパッシブが溜まっていれば防げますが、パッシブがない時はE発動を見たら遠吠えの範囲外へ先に離れます。", "cd": "15 / 14 / 13 / 12 / 11", "g": {"shape": "self", "range": null, "width": null, "radius": 375, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "移動速度に応じた距離を跳びかかり、当たった相手を行動不能（サプレッション）にします。", "c": "直線の跳躍のため、横移動で外れることがあります。拘束（サプレッション）はパッシブが溜まっていれば防げます。", "cd": "110 / 90 / 70", "g": {"shape": "dash", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.1}}}, "core": "通常攻撃とQの回復力です。自分のHPが減るほど回復量が増えるため、ムンドの火力では削り切れません。", "plan": "Qで噛みついて張り付く → 通常攻撃で削る → 逃げようとしたらEの遠吠えで恐怖状態にして追撃する、という流れです。Lv6以降はRの飛びかかりで拘束してから同じ流れに入ります。", "trap": "HPが低いワーウィックほど回復量が大きく、見た目のHP差だけで追うと逆転されます。", "go": "E（ダメージ軽減＋遠吠え）を使い終えた直後です。この間にQとEで短く殴って離れます。", "win": "ブランブル ベスト（重傷）を持ち、ワーウィックのHPが半分以上ある時に短いトレードで削ります。倒すのはLv6以降、味方ジャングルと一緒の時です。", "goal": ["ブランブル ベストを最優先で買う", "HP半分前後で帰還"], "plays": [["Eの遠吠えを使い終えた", "AA→Eの短いトレードをして下がる", "go"], ["Eを発動した（ダメージ軽減中）", "殴らず、遠吠えの範囲外へ離れる", "no"], ["Qで張り付かれた", "フラッシュは使わずWを押して耐える", "w"], ["自分のHPが半分を切った", "Wで位置がばれるので帰還する", "no"]], "key4": "0019", "official": "ワーウィック", "snames": {"P": "永遠の渇き", "Q": "野獣の牙", "W": "血の追跡", "E": "怒りの咆哮", "R": "絶狼牙連撃"}}, {"jp": "トリンダメア", "en": "Tryndamere", "wr": 42.5, "games": 395, "few": false, "tier": "hard", "slug": "tryndamere", "stance": [{"s": "守り", "when": "ランデュイン オーメン等の物理防御が揃うまで"}], "skills": {"P": {"d": "攻撃で怒りゲージ（体力バー下）が溜まり、怒りが多いほどクリティカル率が上がります。", "c": "怒りゲージが満タン近い時はトレードしません。ゲージを必ず見ます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "受動で攻撃力が上がり、発動すると怒りを全て消費してHPを回復します。", "c": "Q使用直後は怒りが0になり、クリティカルがほぼ出ません。これが最大の反撃機会です。", "cd": "12", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "叫んで周囲の敵の攻撃力を下げます。背を向けている相手はスロウされます。", "c": "逃げる時に真後ろを向くとスロウされます。W範囲から出るまでは横方向へ動きます。", "cd": "14", "g": {"shape": "self", "range": null, "width": null, "radius": 850, "angle": null, "speed": null, "cast": 0.3}}, "E": {"d": "指定方向へ回転しながら移動し、周囲を斬ります。クリティカルが出るとEの待ち時間が短くなります。", "c": "逃走・追撃の両方に使われます。Eが使われたかどうかを覚えておきます。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "dash", "range": 660, "width": null, "radius": 225, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "5秒間、HPが一定以下に減らなくなります（死にません）。", "c": "R中に火力を集めても倒せず、こちらのHPとスキルだけ減ります。Rを見たら5秒間は距離を取り、R終了後（Qで回復した直後）にQを当てます。", "cd": "120 / 100 / 80", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}}, "core": "怒りによるクリティカル（強打）の通常攻撃と、Rの「数秒間死なない」時間です。", "plan": "Eの回転移動で接近 → 背を向けたらWでスロウ → クリティカル攻撃で削る → 倒されそうになったらRで粘り、R終了間際にQで大回復、という流れです。", "trap": "HPを削り切ったと思ったタイミングでRが発動し、5秒間一方的に殴られます。トリンダメアのRが残っているかを常に意識します。", "go": "Qを使った直後（怒りが0）と、Rが終わった後です。R発動直後は5秒間倒せないため仕掛けません。Rを使い終えれば次のRまで長い待ち時間があるため、ムンドが勝ちやすくなります。", "win": "Rを使わせてから戦います。物理防御（ランデュイン オーメン等）が揃えば、長期戦はムンドが上回ります。", "goal": ["Rを使わせてからが本番", "怒りゲージ満タンの時は戦わない"], "plays": [["Qで回復した（怒りが0）", "AA→E、Qを当てる", "go"], ["Rが発動した", "5秒間離れ、終了後にQ", "no"], ["怒りゲージが満タン近い", "トレードに応じずCSだけ取る", "no"], ["Wで叫ばれた", "真後ろに逃げず横へ動く", "w"]], "key4": "0023", "official": "トリンダメア", "snames": {"P": "戦場の咆哮", "Q": "血の欲望", "W": "嘲りの叫び", "E": "スピンスラッシュ", "R": "不死の憤激"}}, {"jp": "アンベッサ", "en": "Ambessa", "wr": 43.8, "games": 500, "few": false, "tier": "hard", "slug": "ambessa", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "コア2個以降"}], "skills": {"P": {"d": "スキルを使った後、移動入力の方向へ短くステップし、次の通常攻撃の射程と威力が上がります。", "c": "スキルの数だけ強化攻撃が来ると考え、スキルを連続で使われている間は殴り返さず、W（灰色HP）で受けます。", "cd": null, "g": {"shape": "dash", "range": 350, "width": null, "radius": null, "angle": null, "speed": 950, "cast": null}}, "Q": {"d": "1段目は扇状の薙ぎ払いで、扇の外側（先端）に当たるとダメージが2倍です。1段目が当たると4秒以内に2段目（直線の叩きつけ）が使え、2段目は最初に当たった敵へのダメージが2倍になります。", "c": "1段目は扇の外側（先端）を避け、近づくか射程外にいます。2段目は最初に当たった敵へのダメージが2倍なので、ミニオンの後ろに立つか直線から横に外れます。", "cd": "14 / 13 / 12 / 11 / 10", "g": {"shape": "cone", "range": 400, "width": null, "radius": null, "angle": 180, "speed": null, "cast": 0}, "alt": {"label": "2段目（叩きつけ）", "cd": null, "g": {"shape": "line", "range": 650, "width": 80, "radius": null, "angle": null, "speed": null, "cast": null}}}, "W": {"d": "シールドを張って構え、周囲に衝撃を放ちます。", "c": "W中に殴るとシールドに吸われるうえ、Wの衝撃のダメージが1.5倍になります。W中はQも通常攻撃も控え、シールドが消えてから仕掛けます。", "cd": "18 / 17 / 16 / 15 / 14", "g": {"shape": "self", "range": null, "width": null, "radius": 325, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "鎖付きの刃を振り回して周囲を斬り、スロウします。", "c": "近接距離にいる限り避けられません。Eまで使われたら、そのトレードはすでに不利なので早めに離れます。", "cd": "13 / 12 / 11 / 10 / 9", "g": {"shape": "self", "range": null, "width": null, "radius": 325, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "直線上で最も遠くにいる敵チャンピオンへ瞬間移動して拘束し、地面に叩きつけます。", "c": "直線上の「最も遠い敵」が対象になるため、味方の後ろにいても狙われます。拘束（サプレッション）とその後のスタンはパッシブが溜まっていれば防げます。", "cd": "130 / 115 / 100", "g": {"shape": "line", "range": 1250, "width": 130, "radius": null, "angle": null, "speed": null, "cast": 0.7}}}, "core": "スキルごとに挟まるステップと、その直後の強化通常攻撃です。短時間に大量の攻撃を詰め込みます。", "plan": "Q1段目（扇状）を当てる → Q2段目（直線の叩きつけ）→ Eで周囲を斬ってスロウ → 各スキルの合間にステップして強化攻撃、という連続攻撃です。Lv6以降はRで距離を詰めて始めます。", "trap": "スキル1つにつき強化攻撃1回が付くため、見た目以上に被ダメージが大きくなります。「数回殴られただけ」でもHPが半分近く減ることがあります。", "go": "QとEを両方使い終えた直後です。上級者の実戦では、1回目の帰還で詰め替えポーションを必ず購入し、序盤は耐えることに専念します。", "win": "序盤は耐え、コア2個で五分に持ち込みます。QとEを使わせた後の空白の時間だけ殴ります。", "goal": ["1回目の帰還で詰め替えポーション", "QとEを使い切らせる"], "plays": [["QとEを両方使い終えた", "AA→E、Qを当てて下がる", "go"], ["Q1段目（扇）に当たった", "2段目の直線から横に外れる", "w"], ["スキルを連続で使ってくる", "Wを押して受け、殴り返さない", "w"], ["Wのシールドが張られた", "Qを温存し、消えてから投げる", "no"]], "key4": "0799", "official": "アンベッサ", "snames": {"P": "ドレイクハウンドの猛攻", "Q": "カニングスイープ/サンダリングスラム", "W": "断交", "E": "ラセレイト", "R": "公開処刑"}}, {"jp": "アニビア", "en": "Anivia", "wr": 43.9, "games": 114, "few": true, "tier": "hard", "slug": "anivia", "stance": [{"s": "守り", "when": "レーン戦は無理に勝たず、ロームとウェーブ処理に注意"}], "skills": {"P": {"d": "HPが0になると卵に変わり、一定時間卵が壊されなければ復活します（待ち時間は長めです）。", "c": "卵は短時間では壊しきれないことが多く、深追いで逆に倒されます。卵を割るのは味方と一緒の時だけにします。", "cd": "240", "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "ゆっくり直線に飛ぶ氷の塊を放ち、再発動で爆発させて周囲の敵をスタンさせます。", "c": "速度が遅いため、見てから横に避けられます。当たってもスタンはパッシブで1回防げます。", "cd": "11 / 10 / 9 / 8 / 7", "g": {"shape": "line", "range": 1100, "width": 220, "radius": 225, "angle": null, "speed": 950, "cast": 0.25}}, "W": {"d": "地面に氷の壁を立て、通路を塞ぎます。", "c": "狭い通路（川の入口など）で壁を立てられると逃げられません。味方ジャングルの位置が不明な時は、狭い所に立ちません。", "cd": "17", "g": {"shape": "circle", "range": 1000, "width": 1000, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "単体に氷の矢を撃ちます。冷えている相手（QやRの影響下）には2倍のダメージになります。", "c": "Qに当たった直後や吹雪の中はEが2倍になるため、すぐにその場から離れます。", "cd": "4", "g": {"shape": "unit", "range": 600, "width": null, "radius": null, "angle": null, "speed": 1600, "cast": 0.25}}, "R": {"d": "周囲に吹雪の渦を展開し、中の敵をスロウし続けます。時間とともに範囲が広がります。", "c": "吹雪の中に居続けないことが基本です。吹雪でミニオンを処理されるため、CSは吹雪の外から取れる分だけ取ります。", "cd": "4 / 3 / 2", "g": {"shape": "circle", "range": 750, "width": null, "radius": 400, "angle": null, "speed": null, "cast": 0}}}, "core": "Rの吹雪による持続ダメージとウェーブ処理力、Qのスタンです。", "plan": "Qの氷塊を当ててスタン → 冷えた相手にE（2倍ダメージ）→ 吹雪（R）の中で削る、という流れです。W（氷の壁）で逃げ道を塞ぎ、味方ジャングルと倒しに来ます。", "trap": "吹雪の中でQのスタンとE（2倍）を受けると、一気にHPを失います。", "go": "Qを外した直後です。アニビアはQ以外に身を守る手段が少ないため、Qが待ち時間中なら接近してQとEで削れます。", "win": "レーンで無理に勝とうとせずCSを取ります。アニビアが見えなくなったら味方に知らせ、中盤以降のHP差で押し込みます。", "goal": ["Qを避ける", "吹雪（R）の中に居続けない"], "plays": [["Qを外した／Qが待ち時間中", "近づいてAA→E、Qで削る", "go"], ["Qの氷塊が飛んできた", "横に避ける（当たってもパッシブで1回防げる）", "w"], ["吹雪（R）が展開された", "範囲外から取れるCSだけ取る", "no"], ["卵になった", "味方がいなければ深追いしない", "no"]], "key4": "0034", "official": "アニビア", "snames": {"P": "再誕", "Q": "フラッシュフロスト", "W": "アイスウォール", "E": "フロストバイト", "R": "ブリザード"}}, {"jp": "ザーヘン", "en": "Zaahen", "wr": 44.5, "games": 317, "few": false, "tier": "hard", "slug": "zaahen", "stance": [{"s": "守り", "when": "ゲージ管理を理解するまで"}], "skills": {"P": {"d": "攻撃やスキルを当てるたびに体力バー下のゲージが溜まり（最大12）、攻撃力が上がります。ゲージの色は白（4未満）→黄（4以上）→橙（9以上）→赤（最大）と変わります。赤の時に致命傷を受けると、4秒間無敵かつ動けない状態で大回復し、その後復活します（待ち時間は300〜120秒、レベルで短縮）。ゲージは5秒間攻撃しないと減り始めます。", "c": "ゲージが赤い時は、倒せそうでも倒し切れません。一度距離を取り、5秒以上殴らせないことでゲージを減らしてから戦います。", "cd": "300 / 240 / 180 / 120 （レベルで短縮）", "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "次の通常攻撃が2回攻撃になり、ザーヘンが回復します。少し後に再発動すると、次の通常攻撃がノックアップ付きになります。", "c": "ノックアップはパッシブで1回防げます。Qの強化状態の時に近接距離へ入らないようにします。", "cd": "10 / 9 / 8 / 7 / 6", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "0.5秒の予備動作の後、薙刀を前方に長く伸ばします。当たると最大射程に達した時点でスタンし、ザーヘン側へ引き寄せられます。", "c": "予備動作（0.5秒）が見えるため、横へ動けば避けられます。薙刀はミニオンを貫通して当たった敵全員をスタン・引き寄せするため、ミニオンの後ろに立っても防げません。スタンはパッシブが溜まっていれば防げます。", "cd": "14 / 13.5 / 13 / 12.5 / 12", "g": {"shape": "line", "range": 850, "width": 140, "radius": null, "angle": null, "speed": 2900, "cast": 0.5}}, "E": {"d": "指定位置へダッシュして周囲を斬ります。外周に当たるとダメージが増え、最大HP割合の追加魔法ダメージも入ります。", "c": "最大HP割合のため、HPを積むムンドには外周が特に痛いです。着地点の外周ではなく、ザーヘンに密着するか射程外にいます。", "cd": "10 / 9.5 / 9 / 8.5 / 8", "g": {"shape": "dash", "range": 350, "width": null, "radius": 375, "angle": null, "speed": 900, "cast": 0}}, "R": {"d": "跳び上がって指定地点に叩きつけ、周囲にダメージを与えて回復します。発動から着地までの間は妨害を受けず、被ダメージも半減します。", "c": "着地点に範囲表示が出るため、そこから出ます。R中にQやEを使っても無駄になりやすいため、着地後に使います。", "cd": "110 / 95 / 80", "g": {"shape": "dash", "range": 600, "width": null, "radius": 550, "angle": null, "speed": 2800, "cast": 0.5}}}, "core": "P（決意）のゲージ最大時の大幅な攻撃力上昇と、致命傷を1回だけ無効にする復活です。", "plan": "W（薙刀の突き）でスタン・引き寄せ → Qの2回攻撃で回復 → Q再発動でノックアップ → Eで追撃してゲージを最大まで溜める → 最大ゲージの状態で殴り合い、倒されそうになっても復活で耐える、という流れです。", "trap": "ゲージが赤い状態で倒し切ったつもりでも、4秒後に大回復して復活し、こちらだけが消耗します。", "go": "復活を使わせた後（長い待ち時間）と、ゲージが白い時です。復活を一度使わせれば、次の数分間はムンドが有利に戦えます。", "win": "復活を使わせてから本格的に戦います。それまでは、ゲージが白い時にだけ短いトレードをします。", "goal": ["復活を一度使わせる", "ゲージが赤い時は殴り合わない"], "plays": [["Wの予備動作（薙刀を構える）", "横に動いて直線から外れる（ミニオンでは防げない）", "w"], ["Wを外した", "AA→E、Qを当てて下がる", "go"], ["体力バー下のゲージが赤（最大）", "距離を取り、5秒以上殴らせない", "no"], ["復活を使った", "数分は有利。積極的にトレードする", "go"]], "key4": "0904", "official": "ザーヘン", "snames": {"P": "戦威修養", "Q": "ダーキングレイヴ", "W": "戦慄の再臨", "E": "絢爛たる進撃", "R": "無慈悲なる裁き"}}, {"jp": "クレッド", "en": "Kled", "wr": 44.5, "games": 245, "few": false, "tier": "hard", "slug": "kled", "stance": [{"s": "守り", "when": "Lv1〜6。騎乗中は殴り合わない"}], "skills": {"P": {"d": "騎乗中はトカゲ（スカール）が代わりにダメージを受けます。トカゲのHPが0になると下馬し、敵と戦うと「勇気」ゲージが溜まり、満タンで再び騎乗します（トカゲのHPは一部だけ戻ります）。", "c": "下馬中のクレッドは射程も火力も落ち、最大の弱点です。ただし下馬中に殴り続けると勇気が溜まって再騎乗されるため、下馬させたら一気に削り切るか、倒せないなら離れます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": 400, "cast": null}}, "Q": {"d": "騎乗中はトラバサミ付きの縄を直線に投げます。縄はミニオンを貫通し、最初に当たった敵チャンピオンとクレッドを1.75秒間繋ぎます。縄の範囲は徐々に縮み、その間に範囲外へ離れて縄を切らないと、引き寄せられてダメージとスロウを受けます。下馬中は銃撃に変わります。", "c": "縄はミニオンを貫通するため、ミニオンの後ろでは防げません。横に動いて避けます。当たったら、すぐクレッドから離れる方向へ歩いて縄を切ります（縄の範囲は時間とともに縮みます）。切れずに引き寄せられても、パッシブが溜まっていれば引き寄せは防げます。", "cd": "11 / 10 / 9 / 8 / 7", "g": {"shape": "line", "range": 800, "width": 90, "radius": null, "angle": null, "speed": 1600, "cast": 0.25}, "gl": "騎乗時", "alt": {"label": "下馬時（銃撃）", "cd": "チャージ式（使用間隔3秒）・回復 18 / 16 / 14 / 12 / 10", "g": {"shape": "cone", "range": 700, "width": 80, "radius": null, "angle": null, "speed": null, "cast": null}}}, "W": {"d": "一定間隔で、次の4回の通常攻撃が非常に速くなり、4回目に最大HP割合の追加ダメージが付きます。", "c": "4連撃が始まったら、W（灰色HP）で受けるか、一歩下がって4回目を当てさせないようにします。", "cd": "13 / 12 / 11 / 10 / 9", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "前方へ突進し、敵に当たると短時間後にもう一度その敵へ突進できます。", "c": "2回目の突進は1回目に当たった相手へ向かうため、1回目を避ければ追撃されません。", "cd": "13 / 12 / 11 / 10 / 9", "g": {"shape": "dash", "range": 550, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "遠くの指定地点へ長距離の突撃を開始します。", "c": "主に集団戦・ローム用です。レーンでは突撃を見たら味方に知らせます。", "cd": "140 / 125 / 110", "g": {"shape": "dash", "range": 4500, "width": null, "radius": null, "angle": null, "speed": 1000, "cast": 0}}}, "core": "騎乗中（トカゲに乗っている間）の高い序盤火力と、Qの縄で逃げ道を奪ってからの連続攻撃です。", "plan": "Qの縄を当てて繋ぐ → 引き寄せて通常攻撃とW（4連撃）で削る → E（突進）を2回使って追撃、という流れです。", "trap": "下馬させて油断して殴り続けると、勇気が溜まって騎乗が復活し、トカゲ（HPが一部回復した状態）で反撃されます。", "go": "下馬した直後と、Qの縄を外した直後です。", "win": "下馬させて差をつけます。騎乗中のオールインには付き合いません。", "goal": ["下馬させたら一気に削る", "Qの縄に繋がれたらすぐ離れて切る"], "plays": [["Qの縄を外した", "Qで削り、近づいてきたらAA→E", "go"], ["トカゲから下りた（下馬）", "AA→E→Qで一気に削る。倒せないなら離れる", "go"], ["Wの4連撃が始まった", "Wを押すか一歩下がって4発目を外す", "w"], ["騎乗中にオールインしてきた", "付き合わずタワー方向へ下がる", "no"]], "key4": "0240", "official": "クレッド", "snames": {"P": "弱虫トカゲ「スカール」", "Q": "トラバサミロープ", "W": "狂暴の宴", "E": "ジャウスト", "R": "チャァァァァァァァジ！！！"}}, {"jp": "グウェン", "en": "Gwen", "wr": 44.8, "games": 712, "few": false, "tier": "hard", "slug": "gwen", "stance": [{"s": "守り", "when": "スピリット ビサージュ購入まで"}], "skills": {"P": {"d": "通常攻撃に相手の最大HP割合の魔法ダメージが付き、チャンピオンに当てると回復します。", "c": "短時間でも殴られ続けると大きく削られます。長い殴り合いを避け、Qで削って離れます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "大きなハサミで前方を複数回切ります。通常攻撃を当てた回数に応じて回数が増え、最後の一撃が強くなります。ハサミの中心部分に当たると確定ダメージになります。", "c": "グウェンの正面、ハサミの中心の位置に立たないよう、少し横にずれます。", "cd": "6.5 / 5.75 / 5 / 4.25 / 3.5", "g": {"shape": "line", "range": 465, "width": 360, "radius": 515, "angle": null, "speed": null, "cast": 0.5}}, "W": {"d": "自分の周囲（半径480）に4秒間の霧を出します。霧の外にいる敵チャンピオンからは、通常攻撃もスキルも当たらなくなり、霧の中にいる間は物理防御・魔法防御も上がります。霧から出ようとすると、霧が1回だけグウェンの位置へ付いてきます。タワーの攻撃は霧の外からでも当たります。", "c": "霧が出たらQを投げないでください（当たらずHPだけ減ります）。4秒間はグウェンの射程外へ下がり、霧が消えた後のWの待ち時間（22〜18秒）に仕掛けます。霧の中に入れば攻撃は当たりますが、防御が上がったグウェンと至近距離で戦うことになるため、序盤は勧めません。", "cd": "22 / 21 / 20 / 19 / 18", "g": {"shape": "self", "range": null, "width": null, "radius": 480, "angle": null, "speed": 2000, "cast": 0}}, "E": {"d": "短くダッシュし、その後しばらく攻撃速度と射程が上がります。", "c": "E後は攻撃が速くなり削られやすいため、E直後に殴り合いを受けないよう距離を取ります。", "cd": "13 / 12.5 / 12 / 11.5 / 11", "g": {"shape": "dash", "range": 350, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "針を最大3回まで直線に撃ち出し、ダメージとスロウを与えます。回数を重ねるほど本数が増えます。", "c": "直線のため横へ避けます。スロウされた状態で追撃されるのが危険です。", "cd": "120 / 100 / 80", "g": {"shape": "line", "range": 1350, "width": 240, "radius": null, "angle": null, "speed": 1800, "cast": 0.25}}}, "core": "通常攻撃に付く最大HP割合の魔法ダメージ（P）と、Qの中心部分の確定ダメージです。HPを積むほど被ダメージが増えるため、ムンドには特に不利です。", "plan": "通常攻撃でQの回数を溜める → E（ダッシュ）で接近し攻撃速度を上げる → 溜めたQの中心を当てる → 危なくなったらW（霧）で守る、という流れです。", "trap": "霧の外からQを投げ続けても全て無効になり、HPだけ消費します。", "go": "W（霧）とE（ダッシュ）を使い終えた直後です。この間は守る手段がないため、Qを当てられます。", "win": "魔法防御を持ち、霧（W）とEを使わせてから短く殴ります。長期戦は最大HP割合ダメージで不利になるため避けます。", "goal": ["魔法防御を早めに買う", "霧の外からQを投げない"], "plays": [["WとEを使い終えた", "Qを当ててAA→E、すぐ下がる", "go"], ["霧（W）が出た", "Qを投げずに4秒下がり、霧が消えてから仕掛ける", "no"], ["Eでダッシュしてきた", "距離を取り、長い殴り合いを避ける", "no"], ["Qの溜めが見えた", "ハサミの中心から横にずれる", "w"]], "key4": "0887", "official": "グウェン", "snames": {"P": "裁断", "Q": "チョキチョキッ！", "W": "聖なる霧", "E": "スキップスラッシュ", "R": "針仕事"}}, {"jp": "エイトロックス", "en": "Aatrox", "wr": 45.2, "games": 1047, "few": false, "tier": "hard", "slug": "aatrox", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "コア2個以降"}], "skills": {"P": {"d": "一定間隔で次の通常攻撃が強化され、最大HP割合の追加ダメージと回復を得ます。", "c": "最大HP割合のため、ムンドには刺さる攻撃です。長時間の殴り合いを避けます。", "cd": "22 – 10 （レベルで短縮）", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "大剣を3回連続で叩きつけます。地面に範囲が表示され、1段目と2段目は範囲の先端（遠い側）、3段目は円の中心がスイートスポット（黄色く表示される部分）で、そこに当たるとノックアップと大ダメージになります。", "c": "1段目・2段目は「エイトロックスに近づく（内側へ入る）」か「射程外へ出る」、3段目は「円の外側へ出る」と先端を避けられます。避けられなくてもノックアップはパッシブで1回防げます。", "cd": "14 / 12 / 10 / 8 / 6", "g": {"shape": "line", "range": 625, "width": 180, "radius": null, "angle": null, "speed": null, "cast": 0.6}, "alt": {"label": "3段目", "cd": "14 / 12 / 10 / 8 / 6", "g": {"shape": "circle", "range": 200, "width": null, "radius": 300, "angle": null, "speed": null, "cast": null}}}, "W": {"d": "鎖を直線に放ち、当たった相手をスロウします。範囲から出ないと、一定時間後に中心へ引き戻されます。", "c": "鎖に当たったら、地面に表示された範囲の外へすぐ歩いて出ます。引き戻されると次のQの先端に当たりやすくなります。", "cd": "18 / 16.5 / 15 / 13.5 / 12", "g": {"shape": "line", "range": 825, "width": 160, "radius": null, "angle": null, "speed": 1800, "cast": 0.25}}, "E": {"d": "短いダッシュです。受動で、与えたダメージの一部を回復します。", "c": "EはQの位置調整にも使われるため、Eが残っていると先端を避けても合わせられることがあります。", "cd": "9 / 8 / 7 / 6 / 5", "g": {"shape": "dash", "range": 300, "width": null, "radius": null, "angle": null, "speed": 1340, "cast": 0}}, "R": {"d": "巨大化して攻撃力・移動速度・回復量が上がります。", "c": "R中は回復量が大きく、重傷効果（ブランブル ベスト）がないと削り切れません。R中は戦わず、終了を待ちます。", "cd": "120 / 100 / 80", "g": {"shape": "self", "range": null, "width": null, "radius": 600, "angle": null, "speed": null, "cast": 0.25}}}, "core": "Qの3連撃の「先端（スイートスポット）」によるノックアップと大ダメージ、与ダメージに応じた回復です。", "plan": "Q1段目 → Q2段目 → Q3段目を先端で当てる、その合間にW（鎖）で逃げ道を塞ぎ、E（ダッシュ）でQの位置を調整する流れです。", "trap": "Qの範囲の「真ん中」で避けたつもりでも、1段目・2段目は先端がスイートスポットのため、中途半端な距離が最も危険です。", "go": "Qの3段目まで使い終えた直後です。Qの待ち時間中はエイトロックスの火力が大きく落ちます。上級者の実戦では、靴はプレート スチールキャップ、1回目の帰還で詰め替えポーションを購入します。", "win": "Qの3連撃を避け、Qの待ち時間中に殴ります。R中の回復はブランブル ベスト（重傷）で抑えます。", "goal": ["Qの先端（黄色い部分）を避ける", "R中は戦わない"], "plays": [["Q1・2段目", "内側に入るか射程外へ出る", "w"], ["Q3段目", "円の外側へ出る", "w"], ["Qを3回使い切った", "AA→E、Qを当てる（最大の反撃機会）", "go"], ["Wの鎖に当たった", "地面の範囲の外へすぐ歩いて出る", "no"], ["Rで巨大化した", "終了まで戦わない", "no"]], "key4": "0266", "official": "エイトロックス", "snames": {"P": "死兆の構え", "Q": "ダーキンブレード", "W": "炎獄の鎖", "E": "影進撃", "R": "ワールドエンダー"}}, {"jp": "クイン", "en": "Quinn", "wr": 45.9, "games": 109, "few": true, "tier": "hard", "slug": "quinn", "stance": [{"s": "守り", "when": "CS優先。倒すのは味方ジャングルと一緒に"}], "skills": {"P": {"d": "鷹が定期的に敵に印を付け、クインの次の通常攻撃で追加ダメージを与えます。", "c": "印が付いた状態でクインの射程内に入ると、追加ダメージを受けます。印が付いたら一歩下がります。", "cd": "7 – 2.56 （クリティカル率で短縮）", "g": {"shape": "passive", "range": null, "width": null, "radius": 525, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "鷹を直線に飛ばし、当たった相手の視界を狭めます（周囲が見えにくくなります）。", "c": "直線の飛び道具のため、ミニオンの後ろで防げます。", "cd": "11 / 10.5 / 10 / 9.5 / 9", "g": {"shape": "line", "range": 1050, "width": 120, "radius": 210, "angle": null, "speed": 1550, "cast": 0.25}}, "W": {"d": "受動で攻撃速度と移動速度が上がり、発動で周囲を見通します。", "c": "茂みに隠れても見つかる前提で行動します。", "cd": "50 / 45 / 40 / 35 / 30", "g": {"shape": "self", "range": null, "width": null, "radius": 2100, "angle": null, "speed": null, "cast": null}}, "E": {"d": "相手へ跳びついて攻撃し、スロウしながら後方へ跳ね返ります。", "c": "近づいても距離を離されるため、追いかけ続けるとHPを削られるだけです。深追いしません。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "dash", "range": 600, "width": null, "radius": null, "angle": null, "speed": 2500, "cast": null}}, "R": {"d": "鷹に乗って高速移動します。", "c": "他レーンへ移動されやすいため、クインが見えなくなったら味方に知らせます。", "cd": "3", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}}, "core": "遠距離からの通常攻撃と、P（鷹の印）による追加ダメージです。射程差で一方的に削り続けます。", "plan": "Qで視界を狭める → 通常攻撃で削る → 近づかれたらEで跳ね返って距離を取る、という流れです。", "trap": "追いかけるほど一方的に削られます。「追えば倒せそう」でもEとRで逃げられます。", "go": "Eを使った直後に、ミニオンの後ろからQを当てることです。Qは最低ダメージが保証されているため、HPの少ないクインにも十分なダメージが入ります。", "win": "CSを確保し、味方ジャングルと倒します。単独では追いかけません。", "goal": ["CSを落とさない", "倒すのは味方ジャングルと一緒に"], "plays": [["Eで跳ねてきた直後", "ミニオンの後ろからQを当てる", "go"], ["鷹の印が付いた", "一歩下がって追加ダメージを避ける", "no"], ["逃げていく", "追いかけない", "no"]], "key4": "0133", "official": "クイン", "snames": {"P": "鷲匠", "Q": "暗闇の強襲", "W": "鷲の眼", "E": "飛翔撃", "R": "相棒"}}, {"jp": "ヨネ", "en": "Yone", "wr": 46.0, "games": 1358, "few": false, "tier": "hard", "slug": "yone", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "Lv11以降"}], "skills": {"P": {"d": "クリティカル率が2倍になり、2回に1回の通常攻撃が魔法ダメージになります。", "c": "物理・魔法の両方で削られるため、物理防御だけでは足りません。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "前方への突きです。2回当てると3回目は竜巻付きの突進になり、当たった敵をノックアップします。", "c": "Qを2回当てた後は3回目（竜巻の突進）の準備完了で、竜巻の範囲表示が出ます。この時は近づかず、パッシブが使える時なら当たっても1回防げます。", "cd": "4 – 1.33 （増加攻撃速度で短縮）", "g": {"shape": "line", "range": 450, "width": 160, "radius": 100, "angle": null, "speed": null, "cast": 0.35}, "alt": {"label": "3回目（竜巻の突進）", "cd": "4 – 1.33 （増加攻撃速度で短縮）", "g": {"shape": "dash", "range": 450, "width": 160, "radius": null, "angle": null, "speed": null, "cast": null}}}, "W": {"d": "扇状に斬り、当たった数に応じてシールドを得ます。", "c": "W直後は硬くなるため、W中の殴り合いを避けます。", "cd": "14 – 6 （増加攻撃速度で短縮）", "g": {"shape": "cone", "range": 600, "width": null, "radius": null, "angle": 80, "speed": null, "cast": 0.5}}, "E": {"d": "魂を体から離して前へ移動します。一定時間後、または再発動で元の体の位置へ戻り、その間に与えたダメージの一部を再度与えます。", "c": "E中のヨネは必ず元の体へ戻ります。E中に深追いすると、戻る位置との間で挟まれる形になります。E中はWを押して受け、戻った後にQを当てます。", "cd": "22 / 19 / 16 / 13 / 10", "g": {"shape": "dash", "range": 300, "width": null, "radius": null, "angle": null, "speed": 1200, "cast": null}}, "R": { dius": null, "angle": null, "speed": 2500, "cast": 0.25}}, "W": {"d": "受動で移動速度が上がり（ダメージを受けると一時的に解除）、発動でさらに加速します。", "c": "逃げられやすいため、追いかけるよりQで削る方が効率的です。", "cd": "14", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "通常攻撃に毒が付き、継続ダメージを与えます。", "c": "一度の被ダメージは小さいですが、積み重なります。ムンドは自然回復が高いため、トレード後に無理なく回復できます。", "cd": null, "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "R": {"d": "見えないキノコを地面に仕掛け、踏んだ相手を毒とスロウで削ります。", "c": "通った場所に仕掛けられるため、追いかけるとキノコを踏みます。追撃は深入りせず、茂みの入口など仕掛けられやすい場所を避けます。", "cd": "チャージ3 / 4 / 5回・回復 35 / 30 / 25（使用間隔0.25秒）", "g": {"shape": "circle", "range": 900, "width": null, "radius": 450, "angle": null, "speed": null, "cast": 0.25}}}, "core": "E（毒）の付いた遠距離の通常攻撃と、R（キノコの罠）です。", "plan": "遠くから毒付きの通常攻撃で削る → 近づかれたらQで盲目にして通常攻撃を封じ、Wで逃げる → 茂みや通路に仕掛けたキノコで追撃を防ぐ、という流れです。", "trap": "逃げるティーモを追うとキノコを連続で踏み、大きく削られた状態で反撃されます。", "go": "Qの待ち時間中です。ムンドのQは現在HP割合ですが最低ダメージが保証されているため、HPの少ないティーモにもよく効きます。ミニオンの後ろからQを当て続けます。", "win": "Qの削り合いでHP差を作ります。逃げるティーモは追いません。", "goal": ["Qで削り合う", "逃げるティーモを追わない"], "plays": [["Qを使った後（待ち時間中）", "近づいてAA→E、Qを当てる", "go"], ["盲目（Q）を受けた", "AAとEは外れるのでQで削る", "w"], ["逃げていく", "キノコがあるので追わない", "no"], ["茂みに入った", "奇襲される前提で距離を取る", "no"]], "key4": "0017", "official": "ティーモ", "snames": {"P": "やぶからヨードル", "Q": "目つぶしダーツ", "W": "駆け足！", "E": "毒たっぷり吹き矢", "R": "毒キノコ"}}, {"jp": "イレリア", "en": "Irelia", "wr": 48.2, "games": 454, "few": false, "tier": "even", "slug": "irelia", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "Lv9以降"}], "skills": {"P": {"d": "スキルを敵に当てるたびに攻撃速度が上がり（ミニオンに当てても溜まります）、最大まで溜まると通常攻撃に追加ダメージが付きます。Qでミニオンに跳ぶだけで溜まる点に注意します。", "c": "イレリアの周りに刃が回っている時が最大の状態です。この時はトレードせず、刃が消えるまで待ちます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "対象へダッシュして斬ります。印の付いた敵か、この攻撃で倒せる敵に使うと、待ち時間がなくなります。", "c": "HPの減ったミニオンが多いと、それを足場に何度も跳んできます。自陣タワー手前でフリーズし、足場になるミニオンを少なくします。", "cd": "10 / 9 / 8 / 7 / 6", "g": {"shape": "dash", "range": 600, "width": null, "radius": null, "angle": null, "speed": 1400, "cast": 0}}, "W": {"d": "刃を構えてダメージを大きく軽減し、放すと前方を斬ります。", "c": "W中は物理ダメージ（通常攻撃・E）が大きく軽減されますが、魔法ダメージの軽減はその半分程度です。通常攻撃とEは構えが終わるまで待ち、Q（魔法ダメージ）は当てても構いません。", "cd": "20 / 18 / 16 / 14 / 12", "g": {"shape": "line", "range": 775, "width": 240, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "刃を2本、順に置きます。2本の刃の間を通った敵がスタンし、印が付きます。", "c": "1本目の刃が置かれたら、2本目との間の線に入らないように動きます。スタンはパッシブで1回防げます。", "cd": "16 / 14.5 / 13 / 11.5 / 10", "g": {"shape": "line", "range": 775, "width": 140, "radius": null, "angle": null, "speed": 2000, "cast": 0}}, "R": {"d": "前方へ刃の壁を放ち、当たった敵に印を付け、しばらく刃の壁でスロウします。", "c": "刃の壁を通るとスロウされるため、壁が消えるまで越えません。", "cd": "125 / 105 / 85", "g": {"shape": "line", "range": 1000, "width": 320, "radius": null, "angle": null, "speed": 2000, "cast": 0.4}}}, "core": "Q（斬りかかり）の連続ダッシュと、P（攻撃速度上昇）が最大になった時の追加ダメージです。", "plan": "HPの減ったミニオンにQで跳び移りながら接近 → E（2本の刃）でスタン → 印の付いた相手にQで斬りかかり、Pを最大まで溜めて殴り続ける、という流れです。", "trap": "HPの低いミニオンが多い時は、遠くにいても一瞬で接近されます。", "go": "E（スタン）を外した直後と、Pの刃が消えている時です。ムンド専門ガイド（LoLBuild.JP）では、ワーモグは採用しません。", "win": "自陣でフリーズして足場のミニオンを減らし、Eを外させて削ります。Lv9以降は五分です。", "goal": ["フリーズして足場のミニオンを減らす", "パッシブ最大時は戦わない"], "plays": [["Eのスタンを外した", "AA→E、Qを当てる", "go"], ["刃が体の周りを回っている", "トレードせず離れる", "no"], ["1本目の刃が置かれた", "2本目との線に入らない", "w"], ["W（構え）中", "スキルを使わず終わるのを待つ", "no"]], "key4": "0039", "official": "イレリア", "snames": {"P": "アイオニアの熱情", "Q": "瞬刃", "W": "不屈の舞", "E": "無欠の連舞", "R": "先陣の刃"}}, {"jp": "ナサス", "en": "Nasus", "wr": 48.4, "games": 832, "few": false, "tier": "even", "slug": "nasus", "stance": [{"s": "攻め", "when": "序盤〜Lv6前"}, {"s": "五分", "when": "中盤以降"}], "skills": {"P": {"d": "物理攻撃で与えたダメージの一部を回復します。", "c": "長い殴り合いではナサスが回復します。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "次の通常攻撃が強化され、それで敵を倒すとQのダメージが永久に増えます。", "c": "序盤にQで削って帰還させ、スタック稼ぎを妨害することが最大の仕事です。ナサスが弱い序盤に差を付けます。パッチ26.19でQは弱体化されています。", "cd": "7.5 / 6.5 / 5.5 / 4.5 / 3.5", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "相手の移動速度と攻撃速度を大きく下げます（時間とともに強くなります）。", "c": "スロウはパッシブで防げません。Wを受けたら逃げられないため、HPに余裕がない時はナサスに近づきません。", "cd": "15 / 14 / 13 / 12 / 11", "g": {"shape": "unit", "range": 700, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "地面に魔法陣を出し、中の敵にダメージを与え、物理防御を下げます。", "c": "魔法陣の中に居続けないようにします。", "cd": "12", "g": {"shape": "circle", "range": 650, "width": null, "radius": 400, "angle": null, "speed": null, "cast": 0.25}}, "R": {"d": "巨大化してHPと防御が上がり、周囲の敵に最大HP割合の継続ダメージを与えます。", "c": "R中は戦わず、終了を待ちます。", "cd": "120 / 100 / 80", "g": {"shape": "self", "range": null, "width": null, "radius": 400, "angle": null, "speed": null, "cast": 0.2}}}, "core": "Q（吸魂撃）で倒した数だけ永久に強くなる攻撃と、W（衰弱）の強力なスロウです。", "plan": "序盤はQでミニオンを倒してスタックを稼ぐことに専念し、戦闘は避けます。Lv6以降はWでスロウ → Qで殴る → Rで巨大化して殴り合う、という流れです。", "trap": "Lv6以降はWのスロウで逃げられなくなるため、序盤と同じ感覚で近づくと倒されます。", "go": "Lv1〜5の全ての時間帯です。Qで削り続け、ナサスがミニオンに近づいてQを使う瞬間にこちらのQを合わせます。", "win": "序盤にQで削り、ナサスのスタック稼ぎを邪魔します。ナサスが弱いLv1〜5で差をつけることが勝ち筋です。", "goal": ["Lv1〜5で削り続ける", "Qのスタック稼ぎを邪魔する"], "plays": [["ミニオンにQを使いに来た", "Qを合わせて削る", "go"], ["Lv1〜5", "AA→Eで積極的にトレード", "go"], ["Lv6以降にWのスロウを受けた", "逃げられない。HPに余裕を持って戦う", "no"], ["Rで巨大化した", "終了まで戦わない", "no"]], "key4": "0075", "official": "ナサス", "snames": {"P": "ソウルイーター", "Q": "サイフォンストライク", "W": "ウィザー", "E": "スピリットファイア", "R": "アヌビスの怒り"}}, {"jp": "ヨリック", "en": "Yorick", "wr": 48.5, "games": 363, "few": false, "tier": "even", "slug": "yorick", "stance": [{"s": "五分", "when": "グールと乙女がいない時だけ戦う"}], "skills": {"P": {"d": "周囲で敵が倒れると墓が生まれ、Qの再発動でそこからグールを呼び出せます。", "c": "ミニオンが多く倒れた後はグールが呼ばれやすくなります。グールの数を見て戦うかを判断します。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "次の通常攻撃が強化され、回復します。墓が溜まると再発動でグールを呼び出します。", "c": "グールは範囲攻撃のダメージを軽減し、近接チャンピオンの通常攻撃からは2倍のダメージを受けます。ムンドのWでは一掃しにくいため、通常攻撃で1体ずつ倒します。", "cd": "6 / 5.5 / 5 / 4.5 / 4", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "指定位置に円形の檻を作り、中の敵の移動を閉じ込めます。檻は攻撃すると壊せます。", "c": "閉じ込められたら、ヨリックではなく檻を殴って脱出します。", "cd": "20 / 18 / 16 / 14 / 12", "g": {"shape": "circle", "range": 600, "width": null, "radius": 225, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "霧の塊を投げ、当たった相手をスロウし、グールにその相手を追わせます。", "c": "霧が当たるとグールが一斉に向かってくるため、当たったらグールから離れます。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "circle", "range": 700, "width": null, "radius": null, "angle": null, "speed": 1800, "cast": 0.25}}, "R": {"d": "霧の乙女を召喚します。乙女は一緒に戦い、ヨリックが離れてもレーンを押し続けます。", "c": "乙女がいる時は戦わず、タワー下で守ります。乙女が消えた後が機会です。", "cd": "160 / 130 / 100", "g": {"shape": "circle", "range": 600, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.5}}}, "core": "召喚するグール（小型の亡霊）と霧の乙女の数の力です。召喚物が多い時のヨリックは非常に強力です。", "plan": "墓からグールを呼び出す → E（霧）を当ててグールに追わせる → W（檻）で逃げ道を塞いで殴る、という流れです。Lv6以降はRの乙女を加えて、サイドレーンを押し続けます。", "trap": "W（檻）の中でグールとヨリックに囲まれると、短時間で倒されます。", "go": "グールと乙女がいない時です。ヨリック単体はムンドより弱いため、召喚物が消えた直後にQとEで仕掛けます。", "win": "グールと乙女がいない時だけ殴ります。乙女がいる間はタワー下で守ります。", "goal": ["グールと乙女がいない時だけ戦う", "檻（W）は壊して出る"], "plays": [["グールも乙女もいない", "AA→E、Qで削る", "go"], ["霧（E）に当たった", "グールから離れる", "no"], ["檻に閉じ込められた", "檻を殴って脱出する", "w"], ["グールが出てきた", "通常攻撃で1体ずつ倒す", "w"]], "key4": "0083", "official": "ヨリック", "snames": {"P": "魂の導き手", "Q": "葬送", "W": "屍の列", "E": "悲嘆の霧", "R": "嘆きの墓標"}}, {"jp": "オーン", "en": "Ornn", "wr": 48.6, "games": 558, "few": false, "tier": "even", "slug": "ornn", "stance": [{"s": "五分", "when": "キルよりCS差と装備差を狙う"}], "skills": {"P": {"d": "自身の物理防御・魔法防御・最大HPが強化され、レーン上でも装備を作れます。", "c": "オーンは帰還せずにアイテムを買えるため、HP差で帰還させてもアイテム差になりにくい点に注意します。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "地面を割って直線上にダメージとスロウを与え、先端に岩の柱を立てます。", "c": "柱の近くに立つと、Eの突進で柱ごと巻き込まれてノックアップされます。柱が立ったら離れます。", "cd": "9 / 8.5 / 8 / 7.5 / 7", "g": {"shape": "line", "range": 750, "width": 130, "radius": null, "angle": null, "speed": 1800, "cast": 0.25}}, "W": {"d": "約0.75秒かけて前進しながら前方に炎を吐き、最大HP割合のダメージを与え、最後の炎が当たった相手を「もろい」状態にします。この間のオーンは妨害で止められません。", "c": "最大HP割合のため、ムンドには痛い技です。炎の正面から横にずれます。", "cd": "12 / 11.5 / 11 / 10.5 / 10", "g": {"shape": "line", "range": 500, "width": null, "radius": 175, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "前方へ突進し、壁や柱にぶつかると周囲の敵をノックアップします。", "c": "壁際や柱の近くに立たないことが最大の対策です。ノックアップはパッシブで1回防げます。", "cd": "14 / 13.5 / 13 / 12.5 / 12", "g": {"shape": "dash", "range": 800, "width": null, "radius": 360, "angle": null, "speed": 1600, "cast": 0.35}}, "R": {"d": "遠くから巨大な精霊を呼び寄せ、戻ってくる精霊を頭突きで弾くと、当たった敵がノックアップされます。", "c": "主に集団戦用です。レーンでは精霊の通り道から外れます。", "cd": "140 / 120 / 100", "g": {"shape": "line", "range": 3000, "width": 340, "radius": null, "angle": null, "speed": null, "cast": 0.5}, "alt": {"label": "再発動（頭突き）", "cd": null, "g": {"shape": "dash", "range": 300, "width": 340, "radius": null, "angle": null, "speed": null, "cast": null}}}}, "core": "地形や柱を使ったE（突進）のノックアップと、W（炎の息）の最大HP割合ダメージです。レーン戦の火力は低めで、集団戦の妨害役が本業です。", "plan": "Q（地割れ）で柱を立てる → E（突進）で柱や壁にぶつかってノックアップ → W（炎の息）で「もろい」状態にする → 通常攻撃で「もろい」状態を弾けさせて追加ダメージと短い吹き飛ばし、という流れです。", "trap": "「もろい」状態の時は、オーンの妨害の効果時間とダメージが強化されます（体に表示が出ます）。この状態で柱と壁の近くにいると連続で妨害されます。", "go": "E（突進）を使った直後です。Eのないオーンは逃げ手段がなく、ムンドのQとEで削れます。どちらも倒れにくい対面のため、CSで差を付けることを優先します。", "win": "キルよりCS差と装備差で勝ちます。Eを使わせてから殴ります。", "goal": ["柱と壁のそばに立たない", "CS差をつける"], "plays": [["Eを使った直後", "AA→E、Qで削る", "go"], ["Qで柱が立った", "柱から離れる", "no"], ["Wの炎", "正面から横にずれる", "w"]], "key4": "0516", "official": "オーン", "snames": {"P": "歩く鍛冶場", "Q": "溶岩隆起", "W": "ふいごの息", "E": "灼熱の突撃", "R": "鍛冶神の呼び声"}}, {"jp": "ヴェイン", "en": "Vayne", "wr": 48.9, "games": 307, "few": false, "tier": "even", "slug": "vayne", "stance": [{"s": "五分", "when": "序盤はQで削って有利、中盤以降はステラックの篭手等で対抗"}], "skills": {"P": {"d": "敵チャンピオンに向かって移動すると移動速度が上がります。", "c": "追う・追われる状況ではヴェインが有利です。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": 2000, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "短く転がって移動し、次の通常攻撃を強化します。", "c": "転がる距離は短いため、Qの後に距離を詰め直せます。", "cd": "6 / 5 / 4 / 3 / 2", "g": {"shape": "dash", "range": 300, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "W": {"d": "同じ相手に3回攻撃を当てるたび、最大HP割合の確定ダメージを与えます。対象の体に青い印が溜まっていきます。", "c": "自分の体の印が2つ溜まったら、3回目を受ける前に離れます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "矢を撃って相手をノックバックします。後ろに壁があるとスタンします。", "c": "壁を背にしないことです。壁際で戦うと、ほぼ確実にスタンから大ダメージを受けます。パッシブで1回は防げます。", "cd": "20 / 18 / 16 / 14 / 12", "g": {"shape": "unit", "range": 550, "width": null, "radius": null, "angle": null, "speed": 2200, "cast": 0.25}}, "R": {"d": "一定時間攻撃力が上がり、Qで短時間透明になれます。", "c": "R中は火力が非常に高いため、正面から殴り合わず、透明が切れた瞬間にQを当てます。", "cd": "100 / 85 / 70", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}}, "core": "W（銀の矢）の3回ごとの最大HP割合の確定ダメージです。HPを積むほど被害が増えるため、後半ほどムンドに不利になります。", "plan": "遠くから通常攻撃で削る → Q（転がり）で位置を調整しつつWを溜める → 近づかれたらE（弾き飛ばし）で壁にぶつけてスタン、という流れです。", "trap": "壁際でEを受けてスタンし、そのまま確定ダメージで削り切られる流れです。", "go": "序盤（Lv1〜6）です。ヴェインはHPが少なく、ミニオンの後ろからQを当てるだけで大きく削れます。ムンド専門ガイド（LoLBuild.JP）では、ステラックの篭手の採用が有効です。", "win": "序盤はQで大きく削り、中盤以降はステラックの篭手等で対抗します。", "goal": ["序盤にQで削る", "壁を背にしない"], "plays": [["Lv1〜6", "ミニオンの後ろからQを当て続ける", "go"], ["自分に青い印が2つ", "3発目の前に離れる", "no"], ["Rで透明になった", "透明が切れた瞬間にQ", "w"], ["壁のそばにいる", "Eでスタンされるので離れる", "no"]], "key4": "0067", "official": "ヴェイン", "snames": {"P": "ナイトハンター", "Q": "タンブル", "W": "シルバーボルト", "E": "パニッシュメント", "R": "ファイナルアワー"}}, {"jp": "ゼド", "en": "Zed", "wr": 49.0, "games": 100, "few": true, "tier": "even", "slug": "zed", "stance": [{"s": "五分", "when": "Rに合わせてWを使えれば有利寄り"}], "skills": {"P": {"d": "HPが半分を切った相手への通常攻撃に追加ダメージが付きます。", "c": "HPが半分を切ると被ダメージが増えるため、早めに帰還を考えます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "手裏剣を直線に投げます。影からも同時に投げられ、2枚当たるとダメージが増えます。", "c": "本体と影の両方の直線上に立たないようにします。", "cd": "6", "g": {"shape": "line", "range": 925, "width": 100, "radius": null, "angle": null, "speed": 1700, "cast": 0.25}}, "W": {"d": "影を前方に飛ばし、再発動で影と位置を入れ替えます。", "c": "影がある間は、ゼドが影の位置に瞬間移動してくる可能性があります。", "cd": "20 / 19 / 18 / 17 / 16", "g": {"shape": "dash", "range": 650, "width": null, "radius": null, "angle": null, "speed": 2500, "cast": 0}}, "E": {"d": "周囲を斬ってスロウします。影も同時に斬ります。", "c": "本体と影の両方の斬撃に当たってもダメージは1回分だけですが、影の斬撃に当たるとスロウされ、複数当たるとスロウが強くなります。", "cd": "5 / 4.5 / 4 / 3.5 / 3", "g": {"shape": "self", "range": null, "width": null, "radius": 315, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "対象の背後に瞬間移動し、刻印を付けます。数秒後、刻印の間に与えたダメージに応じて爆発します。", "c": "ムンドのWは発動後に受けたダメージしか灰色HPにできません（最初の0.75秒は80〜95%、その後は25%）。刻印の爆発の直前にWを押すと、爆発ダメージの大部分を保存でき、再発動で回復に回せます。", "cd": "120 / 110 / 100", "g": {"shape": "unit", "range": 625, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}}, "core": "R（死の刻印）からの瞬間火力です。影と一緒に同じスキルを2回当てることで火力を出します。", "plan": "W（影）を前に出す → 影と本体からQ（手裏剣）を同時に当てる → E（周囲斬り）でスロウ、という削りを繰り返します。Lv6以降はRで背後に回り、刻印の爆発で倒し切ります。", "trap": "刻印が付いてから数秒間に殴られた分が、まとめて爆発ダメージになります。", "go": "W（影）を使った直後です。Wの待ち時間中のゼドは逃げ手段がないため、Qで削れます。", "win": "HP差で押し、ゼドのRにWを合わせます。", "goal": ["Rの刻印にWを合わせる", "影の直線上に立たない"], "plays": [["Wを使った直後", "Qで削り、AA→E", "go"], ["Rの刻印が付いた", "爆発直前にWを押し、再発動で回復", "w"], ["影と本体が並んでいる", "両方の直線上に立たない", "no"]], "key4": "0238", "official": "ゼド", "snames": {"P": "弱者必衰", "Q": "風魔手裏剣", "W": "影分身", "E": "影薙ぎ", "R": "死の刻印"}}, {"jp": "モルデカイザー", "en": "Mordekaiser", "wr": 49.3, "games": 641, "few": false, "tier": "even", "slug": "mordekaiser", "stance": [{"s": "五分", "when": "ミニオンの近くで戦い、E（引き寄せ）を避ければ有利寄り"}], "skills": {"P": {"d": "通常攻撃やスキルを3回当てると、周囲に継続ダメージを与える状態になり、移動速度も上がります。", "c": "P発動中（体の周りに黒い渦）は近接距離に居続けないようにします。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": 375, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "前方の長方形の範囲にメイスを叩きつけます。範囲内に敵が1体しかいない時はダメージが増えます。", "c": "ミニオンの近くで戦うとQのダメージが下がります。1対1の状況を作らせないことが重要です。", "cd": "8 / 7 / 6 / 5 / 4", "g": {"shape": "line", "range": 625, "width": 150, "radius": null, "angle": null, "speed": null, "cast": 0.5}}, "W": {"d": "受けたダメージと与えたダメージの一部を溜め、発動でシールドにし、再発動で回復に変換します。", "c": "長い殴り合いほどモルデカイザーが回復します。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "前方に手を伸ばし、当たった敵を自分の方へ引き寄せます。予備動作があります。", "c": "予備動作を見て横に避けます。当たっても引き寄せはパッシブで1回防げます。", "cd": "16 / 14 / 12 / 10 / 8", "g": {"shape": "line", "range": 700, "width": 200, "radius": null, "angle": null, "speed": 3000, "cast": 0.25}}, "R": {"d": "対象と自分を数秒間、異空間（死の国）に閉じ込めて1対1にし、相手の能力値の一部を奪います。", "c": "異空間に入れられたら、自分のRで最大HPと回復を得て耐えます。ムンドのRは時間切れまで耐える力が高いため、R中に焦ってスキルを外さないことが重要です。", "cd": "140 / 120 / 100", "g": {"shape": "unit", "range": 650, "width": null, "radius": 1200, "angle": null, "speed": null, "cast": 0.5}}}, "core": "Q（叩きつけ）の、周りに他の敵がいない時の追加ダメージと、R（死の国）での1対1です。", "plan": "E（引き寄せ）で近づける → 通常攻撃3回でPを起動 → Qを当てる、という流れです。Lv6以降はRで相手を異空間に閉じ込め、能力値を奪って1対1で倒します。", "trap": "ミニオンのいない場所でQを受けると、1体だけに当たるためダメージが30〜50%（ランクに応じて）増えます。", "go": "E（引き寄せ）を外した直後です。Eの待ち時間中はモルデカイザーの接近手段が少ないため、Qで削れます。", "win": "ミニオンの近くで戦い、Eを外させます。", "goal": ["ミニオンの近くで戦う", "Eの引き寄せを避ける"], "plays": [["Eを外した", "AA→E、Qで削る", "go"], ["Eの予備動作", "横に避ける（当たってもパッシブで防げる）", "w"], ["周りにミニオンがいない", "Qが強くなるので戦わない", "no"], ["R（異空間）に入れられた", "自分のRで耐えて時間切れを待つ", "w"]], "key4": "0082", "official": "モルデカイザー", "snames": {"P": "無窮の闇", "Q": "滅魂の一撃", "W": "不滅の鎧", "E": "死の呪縛", "R": "死の国"}}, {"jp": "オラフ", "en": "Olaf", "wr": 50.0, "games": 306, "few": false, "tier": "even", "slug": "olaf", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "Lv9以降"}], "skills": {"P": {"d": "HPが減るほど攻撃速度が上がります。", "c": "HPの減ったオラフほど殴り合いが強くなります。オラフが瀕死でも、自分のHPが少ない時は追いません。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "斧を前方の直線に投げ、当たった敵をスロウします。落ちた斧を拾うとQの待ち時間が大きく短くなります。", "c": "直線のため横に避けます。斧は地面に落ちたまま残るため、オラフが拾いに行く動きを予測してQを合わせます。", "cd": "9", "g": {"shape": "line", "range": 1000, "width": 180, "radius": null, "angle": null, "speed": 1600, "cast": 0.25}}, "W": {"d": "攻撃速度が大きく上がり、減ったHPに応じたシールドを得ます。", "c": "W中は殴り合いが強いため、W発動を見たら一度下がります。", "cd": "16 / 15 / 14 / 13 / 12", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}, "E": {"d": "斧で斬りかかり、確定ダメージを与えます。自分のHPを消費します。", "c": "防御で軽減できないため、序盤の殴り合いでは被ダメージが大きくなります。", "cd": "11 / 10 / 9 / 8 / 7", "g": {"shape": "unit", "range": 325, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "R": {"d": "一定時間、あらゆる妨害が効かなくなり、攻撃力が上がります。", "c": "R中のオラフは妨害が解除され、効かなくなります。ムンドのQのスロウも効かないため、Qで足止めして逃げることはできません。オラフが通常攻撃やEを当てるたびに効果時間が延びるため、R中は早めに距離を取ります。", "cd": "100 / 90 / 80", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}}}, "core": "E（確定ダメージの斬撃）と、HPが減るほど上がる攻撃速度（P）による序盤の殴り合いの強さです。", "plan": "Q（斧）を当ててスロウ → 近づいてE（確定ダメージ）と通常攻撃 → 斧を拾ってQの待ち時間を短縮し、再度Qでスロウ、という繰り返しで逃がさない流れです。", "trap": "斧（Q）を拾われ続けると、スロウが途切れず逃げられなくなります。", "go": "Qの斧を外した直後で、斧から離れた位置にいる時です。拾いに行けない斧の待ち時間は長いため、その間にQで削ります。", "win": "序盤は耐えます。斧（Q）を拾えない位置の時に削り、Lv9以降は五分に戦えます。", "goal": ["序盤の殴り合いを避ける", "斧を拾わせない"], "plays": [["斧を外し、拾えない位置に落ちた", "Qで削る", "go"], ["Wを使った", "一度下がる", "no"], ["斧（Q）が飛んできた", "直線なので横に避ける", "w"], ["自分のHPが少ない", "オラフが瀕死でも追わない", "no"]], "key4": "0002", "official": "オラフ", "snames": {"P": "狂戦士の怒り", "Q": "斧投げ", "W": "根性比べ", "E": "捨て身切り", "R": "ラグナロク"}}, {"jp": "ケイル", "en": "Kayle", "wr": 50.0, "games": 292, "few": false, "tier": "even", "slug": "kayle", "stance": [{"s": "攻め", "when": "Lv1〜10"}, {"s": "守り", "when": "Lv11以降は集団戦で対処"}], "skills": {"P": {"d": "通常攻撃を当てるたびに攻撃速度が上がり、レベルに応じて射程が伸び、範囲攻撃が付いていきます。", "c": "ケイルのレベルを常に確認し、Lv6・Lv11の前後で方針を切り替えます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "剣から光の剣波を直線に放ち、スロウと防御低下を与えます。", "c": "直線のため横に避けます。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "line", "range": 900, "width": 150, "radius": null, "angle": null, "speed": 1600, "cast": null}}, "W": {"d": "自分と味方を回復し、移動速度を上げます。", "c": "逃げに使われるため、追撃はWを使わせてから仕掛けます。", "cd": "15", "g": {"shape": "unit", "range": 900, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "通常攻撃に追加魔法ダメージを付与し、発動すると強化攻撃を放ちます。", "c": "序盤の主なダメージ源です。", "cd": "8 / 7.5 / 7 / 6.5 / 6", "g": {"shape": "buff", "range": null, "width": null, "radius": 350, "angle": null, "speed": null, "cast": 0}}, "R": {"d": "味方1人（自分も可）を数秒間無敵にし、その後周囲に炎の剣を落とします。", "c": "R中は倒せないため、無敵が切れるまで距離を取ります。", "cd": "160 / 120 / 80", "g": {"shape": "unit", "range": 900, "width": null, "radius": 775, "angle": null, "speed": null, "cast": 0.5}}}, "core": "レベル6・11・16で段階的に強化される通常攻撃です。序盤は非常に弱く、後半は最強格の火力になります。", "plan": "序盤はタワー下でCSを取ることに専念します。Lv6で遠距離攻撃になり、Lv11で攻撃が範囲化し、Lv16で完成します。", "trap": "HPを削り切ったと思った瞬間にRで無敵になります。", "go": "Lv1〜5の全ての時間帯です。ミニオンを押してケイルをタワー下に追い込み、Qで削り続けてCSを取りにくくします。この時間帯に差を付けることが、この対面の前提です。", "win": "Lv1〜5の間にQで削り、タワー下に押し込んでCSを取らせないことが勝ち筋です。", "goal": ["Lv1〜5で差をつける", "Lv11以降は正面から戦わない"], "plays": [["Lv1〜5", "ミニオンを押してQで削り続ける", "go"], ["Wで加速して逃げた", "Wを使わせてから追う", "w"], ["Rで無敵になった", "無敵が切れるまで離れる", "no"]], "key4": "0010", "official": "ケイル", "snames": {"P": "聖なる上昇", "Q": "裁きの射光", "W": "天の祝福", "E": "星炎の刃", "R": "聖なる審判"}}, {"jp": "アカリ", "en": "Akali", "wr": 50.9, "games": 409, "few": false, "tier": "even", "slug": "akali", "stance": [{"s": "五分", "when": "魔法防御を持てば有利寄り"}], "skills": {"P": {"d": "アカリのスキルが当たると、相手の周りに輪が現れます。アカリが輪から出ると、次の通常攻撃の射程と威力が上がります。", "c": "輪が出たら、アカリが輪の外から強化攻撃で戻ってきます。輪から出た瞬間に距離を取るか、Wで受けます。", "cd": null, "g": {"shape": "passive", "range": 500, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "扇状にクナイを投げ、先端の敵をスロウします。", "c": "扇の先端（最大射程）に当たると短くスロウされるため、アカリに近いか射程外にいます。ダメージは先端でも同じです。", "cd": "1.5", "g": {"shape": "cone", "range": 500, "width": 350, "radius": null, "angle": 20, "speed": null, "cast": 0.175}}, "W": {"d": "煙幕を張り、中で姿を消し、移動速度が上がります。", "c": "煙幕の中のアカリは見えないため、Qは当てにくくなります。煙幕が消えるのを待つのが確実です。", "cd": "20 / 19 / 18 / 17 / 16", "g": {"shape": "circle", "range": 250, "width": null, "radius": 350, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "後方へ跳びながら手裏剣を投げ、当たった相手へ再発動で飛びつけます。", "c": "手裏剣はミニオンで止まるため、ミニオンの後ろに立ちます。", "cd": "16 / 14.5 / 13 / 11.5 / 10", "g": {"shape": "line", "range": 825, "width": 120, "radius": null, "angle": null, "speed": 1800, "cast": 0.25}, "alt": {"label": "再発動（飛びつき）", "cd": null, "g": {"shape": "dash", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}}, "R": {"d": "1段目で対象へ突進し、2段目の突進は相手の減ったHPが多いほど大ダメージになります。", "c": "HPが減った状態でアカリのRを受けると倒されます。HPが半分を切ったら、Rの射程から離れます。", "cd": "120 / 90 / 60", "g": {"shape": "dash", "range": 675, "width": null, "radius": null, "angle": null, "speed": 1500, "cast": 0.25}, "alt": {"label": "2段目", "cd": null, "g": {"shape": "dash", "range": 800, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}}}, "core": "P（輪から出た後の強化攻撃）と、R2段目の瀕死の相手ほど大きくなる処刑ダメージです。", "plan": "Q（クナイ）で削る → Pの輪から出て強化攻撃 → W（煙幕）で姿を消して反撃を受けない、という削りを繰り返します。Lv6以降はRで突進して倒し切ります。", "trap": "煙幕の中ではアカリが見えず、狙えません。アカリは攻撃した瞬間だけ姿を現すため、こちらから反撃しにくいまま削られます。", "go": "W（煙幕）を使った後です。煙幕の待ち時間中はアカリが隠れられないため、Qで削れます。魔法防御を早めに用意します。", "win": "煙幕を使わせてから削り、自分のHPを半分以上に保ちます。", "goal": ["煙幕の中で戦わない", "HP半分以下でRの射程に入らない"], "plays": [["煙幕（W）を使った後", "Qで削り、AA→E", "go"], ["自分の周りに輪（P）が出た", "輪から出てくる瞬間にWを押すか下がる", "w"], ["煙幕の中にいる", "消えるまで待つ", "no"], ["自分のHPが半分以下", "Rの射程から離れる", "no"]], "key4": "0084", "official": "アカリ", "snames": {"P": "刺客の刻印", "Q": "五連苦無", "W": "黄昏の帳", "E": "翻身手裏剣", "R": "完遂"}}, {"jp": "ボリベア", "en": "Volibear", "wr": 51.2, "games": 508, "few": false, "tier": "fav", "slug": "volibear", "stance": [{"s": "守り", "when": "Lv1〜6"}, {"s": "攻め", "when": "コア1個以降"}], "skills": {"P": {"d": "攻撃するたびに攻撃速度が上がり、最大まで溜まると通常攻撃に雷が付いて周囲に連鎖します。", "c": "長い殴り合いほどボリベアの攻撃が強くなります。短いトレードで離れます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": 450, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "敵に向かって走ると加速し、次の通常攻撃で相手をスタンさせます。", "c": "スタンはパッシブで1回防げます。Qで走ってくるのを見たら、パッシブが上がっているかを確認します。", "cd": "12 / 11.5 / 11 / 10.5 / 10", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "相手を引っかいて印を付けます。印の付いた相手に再度使うと、ダメージが増えて自身も回復します。", "c": "1回目のWを受けたら、2回目（回復付き）を受ける前に離れると回復を防げます。", "cd": "5", "g": {"shape": "unit", "range": 325, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "指定地点に少し遅れて雷を落とし、範囲の敵をスロウします。範囲内にボリベアがいるとシールドを得ます。", "c": "地面の予兆を見て範囲外へ出ます。", "cd": "16", "g": {"shape": "circle", "range": 1200, "width": null, "radius": 325, "angle": null, "speed": null, "cast": null}}, "R": {"d": "跳び上がって指定地点に着地し、近くのタワーを数秒間無力化します。", "c": "Lv6以降、HPが少ない状態でタワー下にいても安全ではありません。HPに余裕を持って帰還します。", "cd": "160 / 135 / 110", "g": {"shape": "dash", "range": 700, "width": null, "radius": 300, "angle": null, "speed": null, "cast": null}}}, "core": "序盤の殴り合いの強さと、R（嵐の化身）でタワーを無力化して飛び込む力です。", "plan": "Q（突進）で加速して接近しスタン → W（引っかき）で印を付け、2回目のWで回復 → P（雷の連鎖）が最大になるまで殴り続ける、という流れです。Lv6以降はRでタワーを止めて、タワー下まで追ってきます。", "trap": "タワー下なら安全だと思っていると、Rでタワーを止めて倒しに来ます。", "go": "Q（突進スタン）の待ち時間中です。中盤以降はムンドの方が伸びるため、コア1個以降は積極的にトレードできます。", "win": "Lv1〜6は耐え、コア1個以降は積極的に殴ります。", "goal": ["序盤のオールインを避ける", "コア1個以降は攻める"], "plays": [["Qで走ってきた", "パッシブがなければ下がる", "w"], ["W1回目を受けた", "2回目の前に離れて回復を防ぐ", "no"], ["Qが待ち時間中", "AA→E、Qで削る", "go"], ["Lv6以降、タワー下にいる", "Rでタワーを止められる。HPに余裕を持つ", "no"]], "key4": "0106", "official": "ボリベア", "snames": {"P": "無慈悲の嵐", "Q": "稲妻の猛攻", "W": "激昂の斬撃", "E": "天破の一撃", "R": "嵐を起こす者"}}, {"jp": "ナー", "en": "Gnar", "wr": 51.3, "games": 509, "few": false, "tier": "fav", "slug": "gnar", "stance": [{"s": "五分", "when": "小型時は攻め、怒りゲージ満タン付近は守り"}], "skills": {"P": {"d": "戦うと怒りゲージが溜まり、満タンで巨大化します。巨大化中はHPと防御が上がり、一定時間後に小型へ戻り、しばらく怒りが溜まりません。", "c": "怒りゲージ（体力バー下）を必ず見ます。満タン付近で近づくと、目の前で巨大化されます。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "小型時はブーメランを投げ、戻ってくるのを拾うと待ち時間が短くなります。巨大化時は岩を投げます。", "c": "ブーメランは戻ってくる軌道でも当たるため、行きと帰りの両方の軌道から外れます。", "cd": "16 / 14.5 / 13 / 11.5 / 10", "g": {"shape": "line", "range": 1125, "width": 110, "radius": null, "angle": null, "speed": 2500, "cast": 0.25}, "gl": "ミニナー時", "alt": {"label": "メガナー時", "cd": "16 / 14.5 / 13 / 11.5 / 10", "g": {"shape": "line", "range": 1150, "width": 180, "radius": 250, "angle": null, "speed": null, "cast": null}}}, "W": {"d": "小型時は同じ相手への3回目の攻撃で追加ダメージ、巨大化時は前方を叩いてスタンさせます。", "c": "巨大化時のスタンはパッシブで1回防げます。", "cd": "常時発動（CDなし）", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}, "gl": "ミニナー時", "alt": {"label": "メガナー時", "cd": "7", "g": {"shape": "line", "range": 550, "width": 200, "radius": null, "angle": null, "speed": null, "cast": null}}}, "E": {"d": "跳躍します。巨大化時は着地点の周囲にダメージを与えます。", "c": "小型時はEで逃げるため、追撃はEを使わせてから行います。", "cd": "22 / 19.5 / 17 / 14.5 / 12", "g": {"shape": "dash", "range": 475, "width": null, "radius": 150, "angle": null, "speed": null, "cast": null}, "gl": "ミニナー時", "alt": {"label": "メガナー時", "cd": "22 / 19.5 / 17 / 14.5 / 12", "g": {"shape": "dash", "range": 675, "width": null, "radius": 375, "angle": null, "speed": null, "cast": null}}}, "R": {"d": "（巨大化時のみ）周囲の敵を指定方向へ吹き飛ばし、壁にぶつかるとスタンさせます。", "c": "巨大化したナーの近くで壁を背にしないことが最重要です。", "cd": "90 / 60 / 30", "g": {"shape": "self", "range": null, "width": null, "radius": 475, "angle": null, "speed": null, "cast": 0.25}}}, "core": "巨大化時（メガナー）の妨害です。特にRで壁にぶつけてのスタンが強力です。小型時は遠距離からの削りが中心です。", "plan": "小型時にQ（ブーメラン）と通常攻撃で削りつつ怒りを溜める → 満タンで巨大化し、W（叩きつけ）でスタン、R（吹き飛ばし）で壁にぶつけてスタン、という流れです。", "trap": "怒りゲージ満タンのナーに近づくと、その場で巨大化されて壁際でRスタンを受けます。", "go": "巨大化が終わって小型に戻った直後です。この時は怒りが溜まらず、HPも低いため、QとEで削る絶好の機会です。", "win": "小型に戻った直後に殴り、怒りゲージが満タンに近い時は離れます。", "goal": ["怒りゲージを見る", "巨大化が解けた直後を狙う"], "plays": [["巨大化が解けて小型に戻った", "近づいてAA→E、Qで削る", "go"], ["怒りゲージが満タン付近", "近づかない", "no"], ["ブーメラン（Q）", "行きと帰りの軌道から外れる", "w"], ["巨大化中", "壁を背にしない", "no"]], "key4": "0150", "official": "ナー", "snames": {"P": "ぷんすこ", "Q": "ブーメラン/ぽいっ", "W": "ごきげん/こてんぱん", "E": "ぴょんぴょん/ドーン！", "R": "ナー！"}}, {"jp": "ガレン", "en": "Garen", "wr": 51.3, "games": 758, "few": false, "tier": "fav", "slug": "garen", "stance": [{"s": "攻め", "when": "Qで削ってPの回復を止め続ける"}], "skills": {"P": {"d": "しばらくダメージを受けないと、HPが大きく回復します。", "c": "ムンドのQを定期的に当てると、回復が止まり続けます。これがこの対面で最も重要な行動です。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "移動速度が上がり、次の通常攻撃で相手を沈黙（スキル使用不可）にします。", "c": "沈黙中はWもRも使えません。Qで走ってきたら、先にWを押しておきます。", "cd": "8", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "受動で防御が上がり、発動でダメージを軽減し、妨害の効果時間を短くします。", "c": "W中の攻撃は軽減されます。", "cd": "22 / 19.5 / 17 / 14.5 / 12", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "数秒間回転して周囲を斬り続けます。", "c": "回転中は近接距離に留まらず、離れてQを投げます。", "cd": "9 / 8.25 / 7.5 / 6.75 / 6", "g": {"shape": "self", "range": null, "width": null, "radius": 325, "angle": null, "speed": null, "cast": null}}, "R": {"d": "空から大剣を落とし、相手の減ったHPに応じた確定ダメージを与えます。", "c": "HPが減った状態でガレンの近くにいると処刑されます。Rのダメージは減ったHPの量で増えるため、HPが大きく減る前にムンドのRを使い、回復で減ったHPを小さく保ちます。", "cd": "120 / 100 / 80", "g": {"shape": "unit", "range": 400, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.435}}}, "core": "E（回転斬り）の持続ダメージと、R（デマーシアの正義）の減ったHPに応じた確定ダメージです。", "plan": "Q（加速）で接近して沈黙 → E（回転斬り）で削る → HPが減ったらRで処刑、という流れです。削られたら離れて、P（自動回復）で回復します。", "trap": "Qの沈黙中にEとRを受けると、WもRも使えないまま倒されます。", "go": "ガレンがQを使った直後と、Pの回復を狙って離れた時です。Qを投げて回復を止めます。ムンド専門ガイド（LoLBuild.JP）では、ステラックの篭手が有効です。", "win": "Qを当て続けてガレンのP（自動回復）を止め、HP差とCS差で勝ちます。", "goal": ["Qでパッシブ回復を止め続ける", "HPが減ったらRに注意"], "plays": [["離れて回復しようとした", "Qを当てて回復を止める", "go"], ["Qで走ってきた", "先にWを押す（沈黙中は使えない）", "w"], ["Qを使った直後", "AA→Eでトレード", "go"], ["Eで回転している", "離れてQを投げる", "no"]], "key4": "0086", "official": "ガレン", "snames": {"P": "タフガイ", "Q": "断固たる一撃", "W": "勇気の護り", "E": "ジャッジメント", "R": "デマーシアの正義"}}, {"jp": "サイオン", "en": "Sion", "wr": 52.1, "games": 499, "few": false, "tier": "fav", "slug": "sion", "stance": [{"s": "攻め", "when": "Qで削り、CS差を付ける"}], "skills": {"P": {"d": "倒されると一定時間だけ動く状態で復活し、暴れ続けます。", "c": "倒した後の復活状態で追いかけられないよう、倒したら距離を取ります。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "斧を振りかぶって溜め、振り下ろします。地面に範囲が表示され、長く溜めるほど広がります。1秒以上溜めるとノックアップとスタンが付きます（最大まで溜めなくても付きます）。", "c": "範囲が表示されてから振り下ろしまで時間があるため、横へ出て避けます。当たってもノックアップはパッシブで1回防げます。", "cd": "10 / 9 / 8 / 7 / 6", "g": {"shape": "line", "range": 850, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "シールドを張り、数秒後に爆発させて周囲にダメージを与えます。", "c": "シールドが爆発する前に離れます。", "cd": "15 / 14 / 13 / 12 / 11", "g": {"shape": "self", "range": null, "width": null, "radius": 525, "angle": null, "speed": null, "cast": null}}, "E": {"d": "前方に咆哮を放ち、防御を下げてスロウします。ミニオンに当たると、吹き飛んだミニオンが後ろの敵に当たります。", "c": "ミニオンの後ろにいても、吹き飛んだミニオンに当たることがあります。サイオンとの直線上のミニオンの後ろに立たないようにします。", "cd": "12 / 11 / 10 / 9 / 8", "g": {"shape": "line", "range": null, "width": 160, "radius": 130, "angle": null, "speed": 1800, "cast": 0.25}}, "R": {"d": "妨害を受けない突進を始め、ゆっくり向きを変えながら進みます。敵チャンピオンや壁にぶつかると叩きつけ、近くの敵を引き寄せてスタン、周りの敵をスロウします。", "c": "サイオンは突進中にゆっくり向きを変えられるため、早めに大きく横へ動いて避けます。引き寄せとスタンはパッシブで1回防げます。", "cd": "140 / 100 / 60", "g": {"shape": "dash", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}}, "core": "Q（溜め叩きつけ）のノックアップとスタン、E（咆哮）の防御低下です。", "plan": "E（咆哮）でスロウと防御低下 → Qを最大まで溜めてノックアップ → 殴る、という流れです。Lv6以降はR（突進）で遠くから飛び込みます。", "trap": "ミニオンの後ろに隠れていても、Eで吹き飛んだミニオンに当たってスロウされます。", "go": "Qの溜めを避けた直後です。サイオンは最大HPが高いため、現在HP割合のムンドのQが大きく入ります。Qを当て続けてCS差を付けます。", "win": "Qで大きく削り、CS差をつけます。", "goal": ["Qの溜めを避ける", "Qを当て続けてCS差"], "plays": [["Qを溜め始めた", "範囲の横へ出る", "w"], ["Qを避けた直後", "AA→E、Qを当てる", "go"], ["Wのシールドを張った", "爆発前に離れる", "no"], ["Eの咆哮", "サイオンとの直線上のミニオンの後ろに立たない", "no"]], "key4": "0014", "official": "サイオン", "snames": {"P": "名誉ある死", "Q": "破滅の斧", "W": "魂の炉心", "E": "殺意の雄叫び", "R": "猪突猛進"}}, {"jp": "セト", "en": "Sett", "wr": 52.1, "games": 710, "few": false, "tier": "fav", "slug": "sett", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "コア1個以降"}], "skills": {"P": {"d": "左右の拳で交互に殴り、右の拳が強力です。HPが減るほど自然回復が増えます。", "c": "通常攻撃の火力が高く、序盤の殴り合いには付き合いません。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "移動速度が上がり、次の2回の通常攻撃が強化されます。", "c": "Qで走ってくるのを見たら距離を取ります。", "cd": "9 / 8 / 7 / 6 / 5", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "溜まった闘魂を消費してシールドを得て、前方に拳を放ちます。拳の中心は確定ダメージ、外側は通常のダメージです。", "c": "闘魂（体力バー下の白いゲージ）が満タンの時は、セトの正面中央に立たず、横にずれます。", "cd": "18 / 16.5 / 15 / 13.5 / 12", "g": {"shape": "cone", "range": 720, "width": 620, "radius": null, "angle": null, "speed": null, "cast": 0.75}}, "E": {"d": "左右の敵を自分の方へ引き寄せて叩きつけます。両側に敵がいるとスタンします。", "c": "両側に敵がいる状況（ミニオンとムンドで挟む形）でスタンになります。セトとミニオンの間に立たないようにします。", "cd": "16 / 14.5 / 13 / 11.5 / 10", "g": {"shape": "line", "range": 450, "width": 280, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "R": {"d": "相手を掴んで跳び、周囲に叩きつけます。", "c": "掴まれた相手の増加HP（アイテム等で増えたHP）に応じて周囲にダメージを与えます。HPを多く積むムンドが掴まれると味方が大きく削られるため、集団戦では注意します。", "cd": "120 / 100 / 80", "g": {"shape": "unit", "range": 400, "width": null, "radius": 600, "angle": null, "speed": null, "cast": null}}}, "core": "W（強撃）の中心部分の確定ダメージです。受けたダメージで溜まる「闘魂」が多いほど強くなります。", "plan": "Q（加速＋強化攻撃）で接近 → 左右の拳で殴って闘魂を溜める → E（引き寄せ）でスタン → 闘魂満タンのWの中心を当てる、という流れです。", "trap": "長く殴り合うほど闘魂が溜まり、最後のWの確定ダメージが大きくなります。", "go": "Wを使った直後（闘魂が空の状態）です。上級者の実戦では序盤最強格の一体のため、1回目の帰還で詰め替えポーションを購入します。", "win": "序盤は耐え、闘魂を溜めさせない短いトレードだけをします。", "goal": ["1回目の帰還で詰め替えポーション", "闘魂満タンのWを横に避ける"], "plays": [["Wを使った直後（闘魂が空）", "AA→E、Qを当てる", "go"], ["闘魂ゲージが満タン", "正面中央から横にずれる", "w"], ["Qで走ってきた", "距離を取る", "no"], ["長い殴り合いになりそう", "付き合わず短いトレードで離れる", "no"]], "key4": "0875", "official": "セト", "snames": {"P": "ファイティングスピリット", "Q": "ナックルダウン", "W": "ヘイメイカー", "E": "フェイスブレイカー", "R": "ショーストッパー"}}, {"jp": "ガングプランク", "en": "Gangplank", "wr": 52.3, "games": 744, "few": false, "tier": "fav", "slug": "gangplank", "stance": [{"s": "攻め", "when": "クリティカル装備が揃う前に差を付ける"}], "skills": {"P": {"d": "一定間隔で次の通常攻撃に火のダメージと移動速度上昇が付きます。", "c": "通常攻撃の強化状態で近づかれると被ダメージが増えます。", "cd": "15", "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "対象を銃で撃ちます。敵を倒すと追加ゴールドを得ます。樽も撃てます。", "c": "遠くの樽を撃って爆発させる手段にもなります。樽の近くにいると遠くから爆発させられます。", "cd": "4.5", "g": {"shape": "unit", "range": 625, "width": null, "radius": null, "angle": null, "speed": 2600, "cast": 0.25}}, "W": {"d": "あらゆる妨害を解除し、HPを回復します。", "c": "スロウを与えても解除されることがあります。", "cd": "22 / 20 / 18 / 16 / 14", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "地面に火薬樽を置きます。樽は攻撃されると爆発し、近くの樽も連鎖して爆発します。爆発はスロウと、物理防御の一部を無視するダメージを与えます。", "c": "樽の近くに立たないことが最重要です。樽は誰でも攻撃でき、HPが少ないため、近くの樽は自分で壊します。", "cd": "チャージ式・回復 17 / 16 / 15 / 14 / 13", "g": {"shape": "circle", "range": 1000, "width": null, "radius": 345, "angle": null, "speed": null, "cast": 0.25}}, "R": {"d": "マップのどこにでも砲撃の雨を降らせます。", "c": "他レーンへの支援に使われるため、レーン戦ではR発動を気にしすぎる必要はありません。", "cd": "160 / 140 / 120", "g": {"shape": "global", "range": null, "width": null, "radius": 580, "angle": null, "speed": null, "cast": 0.25}}}, "core": "E（火薬樽）の連鎖爆発による範囲ダメージです。装備が揃うと樽1回で大きく削られます。", "plan": "Q（銃撃）でCSを取り、樽を置く → 樽を撃って連鎖爆発させ、スロウと大ダメージを与える、という削りを繰り返します。", "trap": "複数の樽がつながって  "変身後の形態の強さです。赤（ラースト＝耐久・回復型）か青（影の暗殺者）のどちらかになります。変身前は弱いチャンピオンです。", "plan": "変身前はQ（回転）でCSを取りつつ、変身のための攻撃を続けます。変身後はW（振り下ろし）でスロウ・ノックアップしてから、Qで削ります。", "trap": "TOPでは珍しいため、壁越しの移動（E）に慣れていないと予想外の位置から奇襲されます。", "go": "変身前の全時間帯です。Qで削り続けてミニオンを押し、変身を遅らせます。", "win": "変身前にQで削り続けて変身を遅らせます。", "goal": ["変身前に削る"], "plays": [["変身前", "Qで削り、ミニオンを押す", "go"], ["Wの予備動作", "横に避ける", "w"], ["壁の中に入った（E）", "深追いしない", "no"]], "key4": "0141", "official": "ケイン", "snames": {"P": "緋眼の大鎌", "Q": "飛影斬", "W": "刃影襲", "E": "影抜き", "R": "真影侵壊"}}, {"jp": "ジャックス", "en": "Jax", "wr": 52.4, "games": 809, "few": false, "tier": "fav", "slug": "jax", "stance": [{"s": "守り", "when": "序盤"}, {"s": "五分", "when": "コア2個以降"}], "skills": {"P": {"d": "通常攻撃を当てるたびに攻撃速度が上がります。", "c": "長い殴り合いほどジャックスが強くなります。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "対象（敵・味方・ワード）へ跳びかかって攻撃します。", "c": "ワードやミニオンにも跳べるため、逃げる時はQで追いつかれる前提で早めに下がります。", "cd": "8 / 7.5 / 7 / 6.5 / 6", "g": {"shape": "dash", "range": 700, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "次の通常攻撃かQに追加魔法ダメージを付けます。", "c": "Q＋Wの組み合わせが序盤の削りの中心です。", "cd": "7 / 6 / 5 / 4 / 3", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "数秒間、通常攻撃をすべて回避し、範囲攻撃のダメージを減らします。終了時（または再発動時）に周囲の敵をスタンさせます。ジャックスが武器を回転させている見た目になります。", "c": "E中は通常攻撃とムンドのE（通常攻撃の強化）が当たりません。E中はQとWで戦うか、距離を取って終了時のスタン範囲から出ます。スタンはパッシブで1回防げます。", "cd": "17 / 15 / 13 / 11 / 9", "g": {"shape": "self", "range": null, "width": null, "radius": 375, "angle": null, "speed": null, "cast": null}}, "R": {"d": "一定回数ごとの通常攻撃に追加魔法ダメージが付きます。発動すると物理防御・魔法防御が上がります。", "c": "R発動中のジャックスは硬いため、R中の殴り合いを避けます。", "cd": "110 / 100 / 90", "g": {"shape": "self", "range": null, "width": null, "radius": 375, "angle": null, "speed": null, "cast": 0.25}}}, "core": "E（反撃の構え）で通常攻撃を回避しながら殴り、終了時にスタンさせることと、P（攻撃速度上昇）による持続火力です。", "plan": "Eを構える → Q（跳びかかり）で接近 → E中に る代わりに、攻撃速度・物理防御貫通・全能吸収（与えたダメージの一部でHP回復）を得ます。", "c": "Rの拘束と蹴り飛ばしは、パッシブが使える状態なら防げます。防げずに壁の向こうへ飛ばされると孤立します。R後のカサンテは最大HPと防御が下がるため、WとRで耐えながら殴り返します。", "cd": "120 / 100 / 80", "g": {"shape": "unit", "range": 300, "width": null, "radius": 350, "angle": null, "speed": 2000, "cast": 0.4}}}, "core": "Q（突き）の3回目の引き寄せと、W（突進）の押し出しを組み合わせた妨害です。R後は攻撃型の形態になり、火力が大きく上がります。", "plan": "Qを2回当てる → 3回目の衝撃波で引き寄せる → W（溜め突進）で押し出して削る、という流れです。Lv6以降はRで壁の向こうへ蹴り飛ばし、孤立させて倒しに来ます。", "trap": "パッシブが待ち時間中にRで壁の向こうへ飛ばされ、1対1を強制されることです。パッシブが使える状態なら、Rの最初の拘束と蹴り飛ばしを防げます。", "go": "Q3回目を外した直後と、R後の攻撃型の形態の時です。", "win": "Qの3回目を避け、R後の攻撃型の形態に殴り返します。", "goal": ["Q3回目を横に避ける", "R後の攻撃型の形態を狙う"], "plays": [["Q3回目の衝撃波", "横に避ける（引き寄せはパッシブで防げる）", "w"], ["Q3回目を外した", "AA→E、Qで削る", "go"], ["Wを溜めている", "正面に立たない", "no"], ["Rを撃たれた", "パッシブがあれば防げる。飛ばされたらWとRで耐えて殴り返す", "w"]], "key4": "0897", "official": "カ・サンテ", "snames": {"P": "不屈の本能", "Q": "破撃のエントーフォ", "W": "切り開く猛進", "E": "辰砂の足取り", "R": "オールアウト"}}, {"jp": "ブラッドミア", "en": "Vladimir", "wr": 52.7, "games": 186, "few": false, "tier": "fav", "slug": "vladimir", "stance": [{"s": "攻め", "when": "Lv1〜6。成長前に差を付ける"}], "skills": {"P": {"d": "増加HPと魔力が相互に変換されます。", "c": "レーンでは意識する必要はありません。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "対象の血を吸い取り、ダメージと回復を得ます。数回使うと強化され、効果が大きくなります。", "c": "強化されたQの回復は大きいため、Qが光っている時は短いトレードに留めます。", "cd": "9 / 7.9 / 6.8 / 5.7 / 4.6", "g": {"shape": "unit", "range": 600, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "W": {"d": "数秒間、足元の血の池になり、ダメージを受けなくなります。", "c": "W中の攻撃は全て無効です。W中にQを投げず、Wが終わってから投げます。", "cd": "28 / 25 / 22 / 19 / 16", "g": {"shape": "self", "range": null, "width": null, "radius": 350, "angle": null, "speed": null, "cast": null}}, "E": {"d": "血を溜めてから周囲に弾けさせ、ダメージを与えます。", "c": "溜め中に距離を取れば被害を減らせます。", "cd": "13 / 11 / 9 / 7 / 5", "g": {"shape": "self", "range": null, "width": 120, "radius": 600, "angle": null, "speed": 4000, "cast": null}}, "
