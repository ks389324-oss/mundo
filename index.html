, "cd": "10 / 9.5 / 9 / 8.5 / 8", "g": {"shape": "unit", "range": 125, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}}, "R": {"d": "一定時間、あらゆる能力値が上がり、その間は毒ガスに重傷（回復阻害）が付きます。", "c": "R中は硬く速いため、戦わずに待ちます。", "cd": "100", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}}, "core": "Q（毒ガス）の持続ダメージです。追いかけさせて毒の跡を踏ませることが勝ち筋です。", "plan": "毒ガスを撒きながら走り回る → 追ってきた相手を毒で削る → E（投げ飛ばし）で自分の味方やタワーの方へ投げる、という流れです。", "trap": "「HPが少ないから倒せる」と追いかけると、毒の跡を踏み続けて逆に倒されます。", "go": "シンジドが自分から近づいてきた時です。CSを取りに来たところにQとEを合わせます。", "win": "追わずにCS差をつけ、近づいてきた時だけ殴ります。", "goal": ["追いかけない", "CS差をつける"], "plays": [["自分から近づいてきた", "AA→E、Qを当てる", "go"], ["逃げていく", "毒の跡を踏むので追わない", "no"], ["接着剤（W）を撒いた", "すぐ出る", "w"], ["Eで投げられそう", "パッシブで防げる。敵タワー側に立たない", "w"]], "key4": "0027", "official": "シンジド", "snames": {"P": "スリップストリーム", "Q": "毒の軌跡", "W": "強力粘着剤", "E": "すくい投げ", "R": "狂人のポーション"}}, {"jp": "リヴェン", "en": "Riven", "wr": 56.3, "games": 263, "few": false, "tier": "fav2", "slug": "riven", "stance": [{"s": "守り", "when": "パッシブが使えない時"}, {"s": "五分", "when": "パッシブが使える時"}, {"s": "攻め", "when": "コア2個以降"}], "skills": {"P": {"d": "スキルを使うたびに、次の通常攻撃に追加ダメージが付きます（最大3回分）。", "c": "スキルの合間に通常攻撃を挟むことで火力を出すため、スキルを連続で使われている間はダメージが大きくなります。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "前方へ3回まで斬りかかります。3回目は跳び上がって周囲の敵を短くノックバックします。", "c": "3回目のノックバックはパッシブで1回防げます。これがこの対面の最大の強みです。", "cd": "13", "g": {"shape": "dash", "range": 225, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "W": {"d": "周囲に衝撃を放ってスタンさせます。", "c": "Q3とWの両方が移動不能系のため、パッシブは片方しか防げません。パッシブを使った直後は、次の連続攻撃を避けます。", "cd": "11 / 10 / 9 / 8 / 7", "g": {"shape": "self", "range": null, "width": null, "radius": 300, "angle": null, "speed": null, "cast": 0.25}}, "E": {"d": "短くダッシュしてシールドを得ます。", "c": "逃げと接近の両方に使われます。Eを使った後のリヴェンは逃げ手段が少なくなります。", "cd": "10 / 9 / 8 / 7 / 6", "g": {"shape": "dash", "range": 250, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "R": {"d": "剣が伸びて攻撃力と射程が上がり、再発動で扇状の剣風を放ちます。剣風は減ったHPが多い相手ほど大ダメージになります。", "c": "HPが減った状態で剣風を受けると倒されます。HPが半分を切ったら、リヴェンのRの射程から離れます。", "cd": "120 / 90 / 60", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.25}, "alt": {"label": "再発動（剣風）", "cd": null, "g": {"shape": "cone", "range": 1100, "width": 200, "radius": null, "angle": null, "speed": null, "cast": null}}}}, "core": "Q（3連撃）とW（スタン）による連続攻撃と、R（剣風）の処刑ダメージです。連続攻撃の多くは移動不能系の妨害に依存しています。", "plan": "Q1・Q2で近づく → Q3（跳び上がり）でノックバック → W（衝撃）でスタン → E（ダッシュ）で離脱、という連続攻撃です。Lv6以降はRで剣を伸ばし、R2段目の剣風で倒し切ります。", "trap": "パッシブが待ち時間中の時に連続攻撃を受けると、Q3とWで行動不能のまま大きく削られます。", "go": "E（ダッシュ）を使った直後と、パッシブが使える状態の時です。ムンドのパッシブが上がっているかを常に確認し、使える時だけトレードに応じます。", "win": "パッシブが使える時だけトレードに応じ、Eを使わせます。", "goal": ["パッシブがある時だけトレード", "Eを使わせる"], "plays": [["Eを使った直後", "AA→E、Qで削る", "go"], ["自分のパッシブが待ち時間中", "連続攻撃を受けないよう下がる", "no"], ["Q3回目・Wのスタン", "パッシブで1回は防げる", "w"], ["自分のHPが半分以下", "R2段目の射程から離れる", "no"]], "key4": "0092", "official": "リヴェン", "snames": {"P": "ルーンブレード", "Q": "折れた翼", "W": "気功破", "E": "勇躍", "R": "追放者の剣"}}, {"jp": "ダリウス", "en": "Darius", "wr": 56.6, "games": 1312, "few": false, "tier": "fav2", "slug": "darius", "stance": [{"s": "守り", "when": "Lv1〜6"}, {"s": "五分", "when": "コア1個以降"}, {"s": "攻め", "when": "コア2個以降"}], "skills": {"P": {"d": "通常攻撃とスキルで出血を付与し、5回重ねると攻撃力が大きく上がります（ダリウスの体が赤く光ります）。", "c": "自分の体の出血表示が溜まってきたら、5回になる前に離れます。ダリウスが赤く光ったら即座に距離を取ります。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "斧を大きく振り回します。外側（刃先）に当たると大ダメージになり、ダリウスが回復します。内側（柄）はダメージが小さく回復もしません。", "c": "Qの振りかぶりが見えたら、ダリウスに密着するか射程外へ出ます。中途半端な距離が最も危険です。", "cd": "9 / 8 / 7 / 6 / 5", "g": {"shape": "self", "range": null, "width": null, "radius": 460, "angle": null, "speed": null, "cast": null}}, "W": {"d": "次の通常攻撃がスロウ付きになります。", "c": "Wでスロウされると逃げられなくなります。", "cd": "5", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "E": {"d": "前方の敵を引き寄せます。受動で物理防御貫通も得ます。", "c": "引き寄せはパッシブで1回防げます。", "cd": "26 / 23.5 / 21 / 18.5 / 16", "g": {"shape": "cone", "range": 535, "width": null, "radius": null, "angle": 50, "speed": null, "cast": 0.25}}, "R": {"d": "跳びかかって確定ダメージを与えます。出血が多いほど威力が増し、倒すと待ち時間がなくなります。", "c": "出血を重ねられ、HPが減った状態で近くにいると処刑されます。", "cd": "120 / 100 / 80", "g": {"shape": "unit", "range": 475, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0.3667}}}, "core": "P（出血）を5回重ねた時の大幅な攻撃力上昇と、R（処刑）の確定ダメージです。序盤の殴り合いはTOPでも最強格です。", "plan": "E（引き寄せ）で近づける → W（スロウ）と通常攻撃で出血を重ねる → Q（振り回し）の刃先で回復 → 出血5回で強化され、Rで処刑、という流れです。", "trap": "出血5回で強化されたダリウスと殴り合うと、HPが十分あっても倒されます。", "go": "E（引き寄せ）を外した直後と、Qを空振りした直後です。序盤最強格の一体のため、1回目の帰還で詰め替えポーションを購入します。序盤は耐えて、装備差で逆転します。", "win": "序盤は殴り合わずに耐え、装備差で逆転します。", "goal": ["1回目の帰還で詰め替えポーション", "出血を5回溜めさせない"], "plays": [["Eを外した／Qを空振りした", "序盤はQだけ当てて離れる。コア1個以降はAA→E、Q", "go"], ["Qの振りかぶり", "密着するか射程外へ", "w"], ["出血が溜まった／体が赤く光った", "即座に離れる", "no"], ["Eの引き寄せ", "パッシブで防げる", "w"]], "key4": "0122", "official": "ダリウス", "snames": {"P": "大出血", "Q": "皆殺しの斧", "W": "脚削ぎ", "E": "捕縛", "R": "ノクサスギロチン"}}, {"jp": "レネクトン", "en": "Renekton", "wr": 56.9, "games": 795, "few": false, "tier": "fav2", "slug": "renekton", "stance": [{"s": "守り", "when": "Lv1〜9"}, {"s": "攻め", "when": "コア2個以降"}], "skills": {"P": {"d": "攻撃すると怒りが溜まり、50以上でスキルが強化されます。HPが減ると怒りの溜まる量が増えます。", "c": "体力バー下の怒りゲージが半分以上（赤く光る状態）の時はトレードしません。", "cd": null, "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}}, "Q": {"d": "周囲を薙ぎ払い、当たった数に応じて回復します。強化時は回復量が増えます。", "c": "ミニオンの近くで受けると回復量が増えるため、ミニオンの集まっている場所でのトレードを避けます。", "cd": "7", "g": {"shape": "self", "range": null, "width": null, "radius": 400, "angle": null, "speed": null, "cast": null}}, "W": {"d": "次の通常攻撃でスタンさせます。強化時はスタン時間が長くなり、シールドを破壊します。", "c": "スタンはパッシブで1回防げます。", "cd": "16 / 14 / 12 / 10 / 8 は回復を当てにした殴り合いをしません。", "cd": "18 / 16 / 14 / 12 / 10", "g": {"shape": "circle", "range": 925, "width": null, "radius": 300, "angle": null, "speed": null, "cast": 0.2419}}, "R": {"d": "触手を直線に放ち、当たった相手を拘束し、近くの敵にも触手が広がります。", "c": "拘束はパッシブで1回防げます。", "cd": "100 / 80 / 60", "g": {"shape": "line", "range": 1370, "width": 240, "radius": null, "angle": null, "speed": 1500, "cast": 0.2419}}}, "core": "Q（溜め矢）の長距離の削りと、W（枯死）を他のスキルで爆発させる最大HP割合ダメージです。Eには重傷効果（回復阻害）が付きます。", "plan": "通常攻撃で枯死を溜める → QやEで爆発させる → Eの矢の雨でスロウと重傷を付ける、という遠距離からの削りです。Lv6以降は、Rの拘束で近づけさせません。", "trap": "Eの重傷でQやWの回復が大きく減り、いつも通り殴り合うと回復が追いつかずに倒されます。", "go": "E（矢の雨）を使った直後で、ヴァルスに接近できる時です。ヴァルスは近接戦闘が弱いため、味方ジャングルと合わせて倒しにいきます。", "win": "接近できれば有利です。味方ジャングルと合わせて倒しにいきます。", "goal": ["接近できれば勝てる", "Eの重傷中は殴り合わない"], "plays": [["Eを使った直後で近づける", "AA→E、Qで削る。味方ジャングルと合わせる", "go"], ["Eの矢の雨", "範囲からすぐ出る（重傷で回復が減る）", "no"], ["枯死の印が溜まった", "QやEを受ける前に離れる", "no"], ["Qの溜め（弓が光る）", "横に動く", "w"]], "key4": "0110", "official": "ヴァルス", "snames": {"P": "復讐の化身", "Q": "乾坤一擲", "W": "枯死の矢筒", "E": "滅びの矢雨", "R": "穢れの連鎖"}}], "basics": [["P（パッシブ）", "一定間隔で、次に受ける「移動不能系」の妨害を1回だけ無効化します。移動不能系には、スタン・拘束・ノックアップ・ノックバック・引き寄せ・恐怖・挑発・魅了・睡眠・サプレッション（行動不能）が含まれます。スロウ・サイレンス・盲目は無効化できません。無効化すると缶が落ち、拾うとHP回復とクールダウン短縮が得られます。敵に缶を踏まれると壊されます。待ち時間は60〜15秒（レベルで短縮）なので、「パッシブで防げる」は、パッシブが使える時に限ります。"], ["Q", "直線に骨ノコを投げます。相手の「現在HP」の割合で魔法ダメージを与え、スロウします。チャンピオンに当てると消費したHPが全額戻ります。レーンでの主な削りと回復の手段です。"], ["W", "周囲に継続ダメージを与えます。発動直後0.75秒に受けたダメージの大部分を「灰色HP」として保存し、再発動時に敵チャンピオンへ当てると全額回復します。相手のバースト（瞬間火力）の直前に押すのが基本です。"], ["E", "最大HPに応じて攻撃力が上がります。発動すると次の通常攻撃が強化され、自分の減っているHPが多いほど威力が増します。通常攻撃のリセット（攻撃の直後に即座にもう一撃）にも使えます。"], ["R", "一定時間、最大HPが増え、移動速度が上がり、大量に自然回復します。逃げにも追撃にも使えます。"], ["強み", "後半に強くなる（伸びる）こと。ムンド専門ガイド（LoLBuild.JP）では、Lv16が最大のパワースパイクです。"], ["弱み", "回復阻害（重傷）、最大HP割合ダメージ、遠距離から一方的に削られる展開、序盤の短期決戦です。"]], "gloss": [["AA", "通常攻撃（オートアタック）のことです"], ["CD", "スキルの再使用待ち時間（クールダウン）のことです"], ["トレード", "短時間だけ殴り合い、与えたダメージが多い方が得をするやり取りのことです"], ["オールイン", "どちらかが倒れるまで続ける全力の戦闘のことです"], ["ポーク", "遠距離から一方的に削ることです"], ["カイト", "距離を保ったまま攻撃し、近づかせないことです"], ["重傷", "回復量を減らす効果です。ムンドの天敵であり、敵の「エクスキューショナー コーリング」「ブランブル ベスト」や、ヴァルスのEなどで付与されます"], ["最大HP割合ダメージ", "相手の最大HPが多いほど大きくなるダメージです。HPを大量に積むムンドには特に痛い種類です"], ["確定ダメージ", "物理防御・魔法防御で軽減できないダメージです"], ["フリーズ", "ミニオンの押し合いを自陣タワー手前で止め、相手を前に出させる状態のことです"], ["パワースパイク", "レベルやアイテム完成で一気に強くなる時点のことです"]], "mundo": {"P": {"cd": "60 – 15 （レベルで短縮）", "g": {"shape": "passive", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": null}, "name": "気ままな往診"}, "Q": {"cd": "4", "g": {"shape": "line", "range": 1050, "width": 120, "radius": null, "angle": null, "speed": 2000, "cast": 0.25}, "name": "骨切りノコギリ"}, "W": {"cd": "17 / 16.5 / 16 / 15.5 / 15", "g": {"shape": "self", "range": null, "width": null, "radius": 325, "angle": null, "speed": null, "cast": 0}, "name": "心臓ビリビリ"}, "E": {"cd": "9 / 8.25 / 7.5 / 6.75 / 6", "g": {"shape": "buff", "range": 650, "width": null, "radius": 155, "angle": null, "speed": null, "cast": 0}, "name": "野蛮な痛み"}, "R": {"cd": "120", "g": {"shape": "buff", "range": null, "width": null, "radius": null, "angle": null, "speed": null, "cast": 0}, "name": "マキシマム投与"}}, "mundoInfo": {"key4": "0036"}}</script>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.champs;
const IMG = JSON.parse(document.getElementById('img').textContent);
const norm = s => String(s).normalize('NFKC').toLowerCase()
  .replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60))
  .replace(/[\s・ー=＝\-'’.]/g, '');
C.forEach(c => { c._k = norm([c.jp, c.official || '', c.en, c.slug].join('|')); });
function matches(c){
  if (state.f !== 'all' && first(c) !== state.f) return false;
  const q = norm(state.q); return !q || c._k.includes(q);
}
const icon = (slug, k) => (IMG[slug] && IMG[slug][k]) || '';
const videoURL = (c, k) => `https://lol.dyn.riotcdn.net/x/videos/champion-abilities/${c.key4}/ability_${c.key4}_${k}1.mp4`;
const TIERS = {hard:'苦手対面（勝率47%未満）',even:'互角対面（47〜51%）',fav:'有利対面①（51〜54%）',fav2:'有利対面②（54%以上）'};
const TIER_SHORT = {hard:'苦手',even:'互角',fav:'有利',fav2:'大きく有利'};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {q:'', f:'all', sort:'group'};
try { const s = JSON.parse(localStorage.getItem('mundo-codex') || '{}'); if (s.f) state.f = s.f; if (s.sort) state.sort = s.sort; } catch(e) {}
function save(){ try { localStorage.setItem('mundo-codex', JSON.stringify({f:state.f, sort:state.sort})); } catch(e) {} }

const first = c => c.stance[0].s;
const mono = c => c.jp.replace(/^[・ー＝]/,'').charAt(0);

function meter(wr){
  const lo = 38, hi = 68;
  const pos = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const a = pos(50), b = pos(wr);
  const left = Math.min(a,b), w = Math.abs(b-a);
  const col = wr >= 51 ? 'var(--atk)' : wr < 47 ? 'var(--def)' : 'var(--even)';
  return `<span class="meter" aria-hidden="true"><i style="left:${left}%;width:${Math.max(w,1.5)}%;background:${col}"></i><b style="left:${a}%"></b></span>`;
}
function tile(c){
  const st = first(c);
  return `<button class="tile st-${st}" type="button" data-slug="${c.slug}" aria-label="${esc(c.jp)} ムンド勝率${c.wr}% 序盤${st}">
    <span class="badge" aria-hidden="true">${icon(c.slug,"c") ? `<img src="${icon(c.slug,"c")}" alt="" loading="lazy">` : esc(mono(c))}</span>
    <span class="nm">${esc(c.jp)}</span>
    <span class="row2"><span class="wr">${c.wr.toFixed(1)}%</span><span>${st}</span>${c.few ? '<span class="tag">少数</span>' : ''}</span>
    ${meter(c.wr)}
  </button>`;
}
function renderList(){
  let rows = C.filter(matches);
  const el = $('#list');
  if (!rows.length){ el.innerHTML = '<p class="empty">該当するチャンピオンがいません。検索語か絞り込みを変えてください。</p>'; return; }
  if (state.sort === 'group'){
    el.innerHTML = Object.keys(TIERS).map(t => {
      const r = rows.filter(c => c.tier === t);
      if (!r.length) return '';
      return `<section class="group"><div class="group-head"><h2>${TIERS[t]}</h2><span>${r.length}体</span></div><div class="grid">${r.map(tile).join('')}</div></section>`;
    }).join('');
  } else {
    rows = rows.slice();
    if (state.sort === 'wr-asc') rows.sort((a,b)=>a.wr-b.wr);
    if (state.sort === 'wr-desc') rows.sort((a,b)=>b.wr-a.wr);
    if (state.sort === 'kana') rows.sort((a,b)=>a.jp.localeCompare(b.jp,'ja'));
    el.innerHTML = `<section class="group"><div class="group-head"><h2>${rows.length}体</h2></div><div class="grid">${rows.map(tile).join('')}</div></section>`;
  }
}

function chainHTML(text){
  const sentences = text.split('。').map(s=>s.trim()).filter(Boolean);
  let out = '', notes = [];
  sentences.forEach(s => {
    if (s.includes(' → ')){
      const body = s.replace(/、?という[^、]*$/,'');
      const steps = body.split(' → ');
      out += `<div class="chain">${steps.map((x,i)=>`${i?'<em>→</em>':''}<span>${esc(x)}</span>`).join('')}</div>`;
    } else notes.push(s + '。');
  });
  if (notes.length) out += `<p class="chain-note">${esc(notes.join(''))}</p>`;
  return out || `<p>${esc(text)}</p>`;
}
function skillChips(s){
  const t = s.d + s.c; const out = [];
  if (/パッシブ[^。]{0,16}防げ(ます|る)/.test(t)) out.push('<span class="chip p">ムンドPで無効化できる</span>');
  if (/未確認|推定/.test(t)) out.push('<span class="chip q">要検証</span>');
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}
const PLAY_TAG = {go:'打ち返す', w:'避ける・受ける', no:'付き合わない'};
const SKILL_NAME = {P:'パッシブ',Q:'Q',W:'W',E:'E',R:'R（アルティメット）'};

/* ---------- 模式アニメーション ---------- */
const LOOP = 2.6;
const SHAPE_JA = {line:'直線の飛び道具',cone:'前方の扇形',circle:'指定地点の範囲',self:'自分の周囲の範囲',dash:'移動（ダッシュ・跳躍）',unit:'対象指定',buff:'自己強化・次の通常攻撃',global:'マップ全域',passive:'常時効果'};
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const f3 = v => clamp(v,0,1).toFixed(3);
function anim(attr, vals, keys){
  return `<animate attributeName="${attr}" values="${vals.join(';')}" keyTimes="${keys.map(f3).join(';')}" dur="${LOOP}s" repeatCount="indefinite"/>`;
}
function num(v){ return (typeof v === 'number' && isFinite(v) && v > 0) ? v : null; }
function fig(g){
  const W = 360, x0 = 22, L = 318;
  const flags = [];
  const shape = g.shape || 'buff';
  let range = num(g.range), width = num(g.width), radius = num(g.radius), angle = num(g.angle), speed = num(g.speed);
  const cast = num(g.cast) ? clamp(g.cast, 0, 0.9) : 0;
  const c = cast || 0.12, k0 = c / LOOP;
  const parts = [SHAPE_JA[shape] || ''];
  if (num(g.range) && shape !== 'self') parts.push(`射程 ${Math.round(g.range)}`);
  if (num(g.width)) parts.push(`幅 ${Math.round(g.width)}`);
  if (num(g.radius)) parts.push(`半径 ${Math.round(g.radius)}`);
  if (num(g.angle)) parts.push(`角度 ${g.angle}°`);
  if (num(g.cast)) parts.push(`詠唱 ${+g.cast.toFixed(2)}秒`);

  /* 範囲を持たないスキル：相手と効果の表示だけ */
  if (shape === 'buff' || shape === 'passive' || shape === 'global'){
    const H = 58, y = 29, r = 8;
    const txt = {buff:'自分を強化する（当たり判定の範囲なし）', passive:'常に働く効果（当たり判定の範囲なし）', global:'マップのどこにでも届く'}[shape];
    const ring = shape === 'global'
      ? `<circle cx="${x0}" cy="${y}" class="aura">${anim('r',[r, r, 360, 360],[0,0.05,0.75,1])}${anim('opacity',[0,1,0,0],[0,0.05,0.75,1])}</circle>`
      : `<circle cx="${x0}" cy="${y}" class="aura">${anim('r',[r+1, r+1, r+14, r+1],[0,k0,0.55,1])}${anim('opacity',[0,1,0,0],[0,k0,0.55,1])}</circle>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SHAPE_JA[shape]}">
      <circle cx="${x0}" cy="${y}" r="${r + 3}" class="aura" opacity=".45"/>
      <circle cx="${x0}" cy="${y}" r="${r}" class="foe"/>
      <text x="${x0 + r + 12}" y="${y + 4}" class="t">${txt}</text><g class="anim">${ring}</g></svg>`;
    return {svg, cap: parts.join(' · ')};
  }

  let wall = false;
  if (shape === 'line'){ if (!range){ range = 600; flags.push('射程'); } if (!width){ width = 80; flags.push('幅'); } }
  if (shape === 'cone'){ if (!range){ range = 400; flags.push('射程'); } if (!angle){ angle = 60; flags.push('角度'); } }
  if (shape === 'circle'){
    if (!range){ range = 300; flags.push('射程'); }
    if (!radius){ if (width){ wall = true; } else { radius = 150; flags.push('範囲'); } }
  }
  if (shape === 'self' && !radius){ if (range){ radius = range; } else { radius = 300; flags.push('範囲'); } }
  if (shape === 'dash' && !range){ range = 400; flags.push('距離'); }
  if (shape === 'unit' && !range){ range = 500; flags.push('射程'); }

  const reach = {line:range, cone:range, circle:range + (radius || 0), self:radius, dash:range + (radius || 0), unit:range}[shape];
  const clipped = reach > 2000;
  const maxU = clamp(reach * 1.15, 700, 2000);
  const halfU = {line:width / 2, cone:range * Math.sin(Math.min(angle, 180) * Math.PI / 360), circle:wall ? width / 2 : radius, self:radius, dash:radius || 0, unit:0}[shape] || 0;
  const s = Math.min(L / maxU, halfU > 0 ? 72 / halfU : Infinity);
  const shownU = L / s;
  const half = Math.max(halfU * s, 20);
  const y = 6 + half, ry = y + half + 8, H = ry + 17;
  const X = u => x0 + Math.min(u, shownU) * s;
  const foeR = 7, meR = 8;
  let mx;
  if (shape === 'line' || shape === 'cone' || shape === 'unit') mx = Math.min(range * 0.88, shownU * 0.9);
  else if (shape === 'circle') mx = Math.min(range, shownU * 0.9);
  else if (shape === 'self') mx = radius * 0.7;
  else mx = Math.min(range + 90, shownU * 0.95);
  const MX = X(mx);
  let st = '', an = '';
  if (cast) an += `<circle cx="${x0}" cy="${y}" class="aura">${anim('opacity',[1,1,0,0],[0,k0,k0+0.01,1])}${anim('r',[foeR+1,foeR+7,foeR+7,foeR+1],[0,k0,k0+0.01,1])}</circle>`;
  const flash = (k, cx) => `<circle cx="${cx}" cy="${y}" r="${meR + 4}" class="hit">${anim('opacity',[0,0,0.9,0,0],[0,k,k+0.04,k+0.22,1])}</circle>`;

  if (shape === 'line'){
    const w = Math.max(3, width * s), xe = X(range);
    st += `<rect x="${x0}" y="${y - w/2}" width="${xe - x0}" height="${w}" class="area"/>`;
    const t = clamp(range / (speed || 1800), 0.25, 1.3), k1 = (c + t) / LOOP, pw = clamp(w, 5, 16);
    an += `<rect y="${y - w/2}" width="${pw}" height="${w}" class="hit" rx="2">${anim('x',[x0, x0, xe - pw, xe - pw],[0,k0,k1,1])}${anim('opacity',[0,1,1,0,0],[0,k0,k1,k1+0.02,1])}</rect>`;
    if (mx <= range) an += flash(k0 + (k1 - k0) * (mx / range), MX);
  } else if (shape === 'cone'){
    const R = range * s, a = Math.min(angle, 180) * Math.PI / 360;
    const p = `M${x0} ${y} L${x0 + R*Math.cos(a)} ${y - R*Math.sin(a)} A${R} ${R} 0 0 1 ${x0 + R*Math.cos(a)} ${y + R*Math.sin(a)} Z`;
    st += `<path d="${p}" class="area"/>`;
    an += `<path d="${p}" class="hit">${anim('opacity',[0,0,0.7,0,0],[0,k0,k0+0.06,k0+0.3,1])}</path>`;
  } else if (shape === 'circle'){
    const cx = X(range);
    st += `<line x1="${x0}" y1="${y}" x2="${cx}" y2="${y}" class="trail"/>`;
    if (wall){
      const h = width * s;
      st += `<rect x="${cx - 3}" y="${y - h/2}" width="6" height="${h}" class="area"/>`;
      an += `<rect x="${cx - 3}" y="${y - h/2}" width="6" height="${h}" class="hit">${anim('opacity',[0,0,0.8,0.8,0],[0,k0+0.08,k0+0.12,0.8,1])}</rect>`;
    } else {
      const r = radius * s;
      st += `<circle cx="${cx}" cy="${y}" r="${r}" class="area"/>`;
      an += `<circle cx="${cx}" cy="${y}" r="${r}" class="hit">${anim('opacity',[0,0,0.65,0,0],[0,k0+0.1,k0+0.16,k0+0.4,1])}</circle>`;
    }
  } else if (shape === 'self'){
    const r = radius * s;
    st += `<circle cx="${x0}" cy="${y}" r="${r}" class="area"/>`;
    an += `<circle cx="${x0}" cy="${y}" class="hit">${anim('r',[0,0,r,r],[0,k0,k0+0.14,1])}${anim('opacity',[0,0.7,0.6,0,0],[0,k0,k0+0.14,k0+0.4,1])}</circle>`;
  } else if (shape === 'dash'){
    const xe = X(range);
    st += `<line x1="${x0}" y1="${y}" x2="${xe}" y2="${y}" class="trail"/><path d="M${xe} ${y} l-6 -4 v8 z" class="foe" opacity=".6"/>`;
    if (radius) st += `<circle cx="${xe}" cy="${y}" r="${radius * s}" class="area"/>`;
    const k1 = k0 + 0.18;
    an += `<circle cy="${y}" r="${foeR}" class="foe">${anim('cx',[x0, x0, xe, xe],[0,k0,k1,1])}${anim('opacity',[0,0.9,0.9,0.9,0],[0,k0,k1,0.85,1])}</circle>`;
    if (radius) an += `<circle cx="${xe}" cy="${y}" r="${radius * s}" class="hit">${anim('opacity',[0,0,0.6,0,0],[0,k1,k1+0.04,k1+0.3,1])}</circle>`;
  } else if (shape === 'unit'){
    const xr = X(range);
    st += `<line x1="${xr}" y1="${y - 18}" x2="${xr}" y2="${y + 18}" class="trail"/>`;
    an += `<line x1="${x0}" y1="${y}" y2="${y}" class="trail" style="stroke-dasharray:none">${anim('x2',[x0, x0, MX, MX],[0,k0,k0+0.12,1])}${anim('opacity',[0,1,1,0,0],[0,k0,k0+0.3,k0+0.34,1])}</line>`;
    an += flash(k0 + 0.12, MX);
  }
  let ruler = `<line x1="${x0}" y1="${ry}" x2="${x0 + L}" y2="${ry}" class="ln"/>`;
  const step = shownU > 1600 ? 500 : 250;
  for (let u = 0; u <= shownU; u += step){
    const xx = X(u), big = u % (step * 2) === 0;
    ruler += `<line x1="${xx}" y1="${ry}" x2="${xx}" y2="${ry + (big ? 5 : 3)}" class="ln"/>`;
    if (big) ruler += `<text x="${xx}" y="${ry + 13}" text-anchor="middle" class="tm">${u}</text>`;
  }
  if (1050 <= shownU){
    const qx = X(1050);
    ruler += `<path d="M${qx} ${ry - 1} l-3.5 -6 h7 z" class="me"/>` + (Math.abs(qx - MX) > 34 ? `<text x="${qx}" y="${ry - 9}" text-anchor="middle" class="mq">ムンドQ</text>` : '');
  }
  if (clipped) ruler += `<text x="${x0 + L}" y="${ry - 4}" text-anchor="end" class="tm">→ ${Math.round(reach)}まで届く</text>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SHAPE_JA[shape]}の模式図">
    ${ruler}${st}
    <circle cx="${MX}" cy="${y}" r="${meR}" class="me"/><text x="${MX}" y="${y + meR + 11}" text-anchor="middle" class="t">ムンド</text>
    <circle cx="${x0}" cy="${y}" r="${foeR}" class="foe"/><text x="${x0}" y="${y + foeR + 11}" text-anchor="middle" class="t">相手</text>
    <g class="anim">${an}</g></svg>`;
  const cap = parts.join(' · ') + (flags.length ? `（${flags.join('・')}は公式表記なしのため目安）` : '');
  return {svg, cap};
}
function cdText(cd){
  if (!cd) return 'なし（常時効果）';
  if (/常時/.test(cd)) return cd;
  if (/チャージ/.test(cd)) return cd.replace(/(回復 [\d.\s\/]*[\d.])(\s*)(（|$)/, '$1秒$3');
  const m = cd.match(/^(.*?[\d.])\s*(（.*）)?$/);
  return m ? m[1] + '秒' + (m[2] || '') : cd;
}
function cdHTML(cd){ return `<span class="cd"><small>CD</small>${esc(cdText(cd))}</span>`; }
function variantHTML(v, label, hidden, idx){
  const f = fig(v.g || {});
  return `<div class="variant" data-v="${idx}" ${hidden ? 'hidden' : ''}>
    <div class="skill-head">${cdHTML(v.cd)}${label ? `<span class="form">${esc(label)}</span>` : ''}</div>
    <figure class="fig" style="margin:0">${f.svg}<figcaption class="fig-cap"><span>${esc(f.cap)}</span></figcaption></figure>
  </div>`;
}
function skillRow(k, s, c){
  const hasAlt = !!s.alt;
  const toggle = hasAlt ? `<div class="skill-head" style="margin:6px 0 0"><button type="button" class="alt-toggle" aria-pressed="false" data-alt>${esc(s.alt.label)}を表示</button></div>` : '';
  const nm = c.snames ? c.snames[k] : '';
  return `<div class="skill"><span class="key" aria-label="${SKILL_NAME[k]}">${icon(c.slug,k) ? `<img src="${icon(c.slug,k)}" alt="">` : ''}<i>${k}</i></span>
    <div class="skill-grid">
      <div><div class="skill-head">${nm ? `<span class="sname">${esc(nm)}</span>` : ''}<a class="vid" href="${videoURL(c,k)}" target="_blank" rel="noopener">▶ 実際の動画</a></div><p class="d">${esc(s.d)}</p>${s.c ? `<p class="c"><b>対策</b>${esc(s.c)}</p>` : ''}${skillChips(s)}</div>
      <div>${variantHTML(s, s.gl || (hasAlt ? '通常' : ''), false, 0)}${hasAlt ? variantHTML(s.alt, s.alt.label, true, 1) : ''}${toggle}</div>
    </div></div>`;
}

let lastFocus = null;
function openSheet(html, title){
  lastFocus = document.activeElement;
  const sh = $('#sheet');
  sh.innerHTML = html; sh.hidden = false; $('#scrim').hidden = false;
  sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  const x = sh.querySelector('[data-close]'); if (x) x.focus();
}
function closeSheet(){
  $('#sheet').hidden = true; $('#scrim').hidden = true; document.body.style.overflow = '';
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function currentList(){
  let rows = C.filter(matches);
  if (state.sort === 'wr-asc') rows.sort((a,b)=>a.wr-b.wr);
  else if (state.sort === 'wr-desc') rows.sort((a,b)=>b.wr-a.wr);
  else if (state.sort === 'kana') rows.sort((a,b)=>a.jp.localeCompare(b.jp,'ja'));
  return rows.length ? rows : C;
}
const closeBtn = `<button class="iconbtn" type="button" data-close aria-label="閉じる"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`;

function openChamp(slug, push){
  const c = C.find(x => x.slug === slug); if (!c) return;
  const list = currentList(); const i = list.indexOf(c);
  const prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  const st = first(c);
  const flow = c.stance.map((s,k)=>`${k?'<span class="arr" aria-hidden="true">→</span>':''}<div class="step st-${s.s}"><strong>${s.s}</strong><small>${esc(s.when)}</small></div>`).join('');
  const skills = ['P','Q','W','E','R'].map(k => skillRow(k, c.skills[k], c)).join('');
  const html = `
  <div class="sheet-bar">${closeBtn}<span class="t" id="sheetTitle">${esc(c.jp)}（${esc(c.en)}）</span></div>
  <div class="sheet-body">
    <div class="hero st-${st}">
      <span class="badge" aria-hidden="true">${icon(c.slug,"c") ? `<img src="${icon(c.slug,"c")}" alt="" loading="lazy">` : esc(mono(c))}</span>
      <div>
        <h2>${esc(c.jp)}</h2>
        <div class="en">${esc(c.en)}</div>
        <div class="stats"><span>ムンド勝率</span><span class="wr">${c.wr.toFixed(1)}%</span><span>${c.games.toLocaleString()}試合</span><span class="tag">${TIER_SHORT[c.tier]}</span>${c.few ? '<span class="tag">少数データ</span>' : ''}</div>
      </div>
    </div>
    <section><p class="sec-label">対応方針</p><div class="flow">${flow}</div></section>
    <section><p class="sec-label">ムンドの勝ち筋</p>
      <p class="win">${esc(c.win||'')}</p>
    </section>
    <section><p class="sec-label">レーン戦の早見表（こう来たら、こうする）</p>
      <div class="goals">${(c.goal||[]).map(x=>`<span>狙い：${esc(x)}</span>`).join('')}</div>
      <ol class="plays">${(c.plays||[]).map(([a,b,k])=>`<li class="play ${k}"><span class="if">こうなったら：<b>${esc(a)}</b></span><span class="then"><span class="tg">${PLAY_TAG[k]}</span><span>${esc(b)}</span></span></li>`).join('')}</ol>
      <p class="note" style="margin-top:6px">「AA→E」は、通常攻撃の直後にEを押して即座にもう一撃入れる、ムンドの基本の短いトレードです（「ムンドの基本・用語」参照）。</p>
    </section>
    <section><p class="sec-label">対面したらまずこれ</p>
      <div class="cards">
        <div class="card"><h3>主力</h3><p>${esc(c.core)}</p></div>
        <div class="card"><h3>相手の狙い</h3>${chainHTML(c.plan)}</div>
        <div class="card trap"><h3>分からん殺し注意</h3><p>${esc(c.trap)}</p></div>
        <div class="card go"><h3>攻めて良い瞬間</h3><p>${esc(c.go)}</p></div>
      </div>
    </section>
    <section><p class="sec-label">スキル別の特徴・CD・対策</p>
      <p class="note" style="margin:0 0 8px">「▶ 実際の動画」を押すと、Riot公式のスキル動画が小さな別ウィンドウで再生されます（使えない環境では新しいタブで開きます）。右の図は上から見た模式図で、赤い範囲が当たり判定、下の目盛りが射程（ゲーム内の距離単位）、紫の三角はムンドのQの届く距離（1050）です。CDは最大ランクまでの値で、スキルヘイスト（CD短縮）なしの場合です。</p>
      <div class="skills">${skills}</div></section>
    <section><p class="sec-label">関連リンク</p>
      <div class="links">
        <a href="https://www.leagueoflegends.com/ja-jp/champions/${c.slug}/" target="_blank" rel="noopener">公式ページ ↗</a>
        <a href="https://lolalytics.com/lol/drmundo/vs/${c.slug}/build/" target="_blank" rel="noopener">LoLalyticsの対面データ ↗</a>
      </div>
    </section>
    <div class="navrow">
      <button class="btn" type="button" data-go="${prev.slug}">← ${esc(prev.jp)}</button>
      <button class="btn" type="button" data-go="${next.slug}">${esc(next.jp)} →</button>
    </div>
  </div>`;
  openSheet(html);
  if (push !== false) { try { history.replaceState(null, '', '#' + c.slug); } catch(e) {} }
}

function openBasics(){
  const html = `
  <div class="sheet-bar">${closeBtn}<span class="t" id="sheetTitle">ムンドの基本・用語</span></div>
  <div class="sheet-body">
    <section><p class="sec-label">ムンドの基本性能（全対面共通）</p>
      <div class="skills">${D.basics.map(([k,v])=>{ const key = k.replace(/（.*）/,''); const m = D.mundo[key];
        return `<div class="skill"><span class="key">${m && icon('drmundo',key) ? `<img src="${icon('drmundo',key)}" alt=""><i>${esc(key)}</i>` : esc(key.replace('強み','強').replace('弱み','弱'))}</span><div>${m ? `<div class="skill-head">${m.name ? `<span class="sname">${esc(m.name)}</span>` : ''}${cdHTML(m.cd)}<a class="vid" href="${videoURL(D.mundoInfo,key)}" target="_blank" rel="noopener">▶ 実際の動画</a></div>` : ''}<p class="d">${esc(v)}</p></div></div>`; }).join('')}</div>
    </section>
    <section><p class="sec-label">ムンドの基本のトレード</p>
      <div class="combo">
        <div><b>短いトレード</b>近づいて通常攻撃 → すぐE（攻撃リセットでもう一撃）→ 下がる。相手の主力スキルが待ち時間の時に使います。</div>
        <div><b>削り</b>ミニオンの後ろからQ。チャンピオンに当たれば使ったHPが全額戻るので、外さない位置から投げます。</div>
        <div><b>受け</b>相手の連続攻撃や大技の直前にW → 受けた後に再発動。敵チャンピオンに当てれば、溜めた灰色HPが全額回復します。</div>
        <div><b>凌ぐ</b>HPが大きく減ったらRで回復しつつ離脱。追撃にも使えますが、序盤は逃げ用に残す方が安全です。</div>
      </div>
    </section>
    <section><p class="sec-label">対応方針の意味</p>
      <div class="cards">
        <div class="card st-攻め" style="border-color:var(--atk)"><h3 style="color:var(--atk)">攻め</h3><p>Qで削り続け、ミニオンを押して相手をタワー下に追い込みます。</p></div>
        <div class="card" style="border-color:var(--even)"><h3 style="color:var(--even)">五分</h3><p>「攻めて良い瞬間」が来た時だけトレードし、それ以外はCSを優先します。</p></div>
        <div class="card wide" style="border-color:var(--def)"><h3 style="color:var(--def)">守り</h3><p>自陣タワー手前でフリーズし、Qでのラストヒット中心に最低限のCSを取ります。レベルと装備で差がつくまで待ちます。</p></div>
      </div>
    </section>
    <section><p class="sec-label">用語集</p>
      <div style="overflow-x:auto"><table class="gl"><tbody>${D.gloss.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div>
    </section>
    <section><p class="sec-label">データについて</p>
      <p class="note">勝率はLoLalytics（パッチ26.19、エメラルド以上）の集計で、試合全体の結果です。レーン戦の勝ち負けとは一致しません。ダリウス・レネクトン・リヴェンは勝率上は有利ですが、序盤のレーン戦は相手が優位です。「要検証」の印が付いた記述は、練習モードで確かめてから頼ってください。全55体の記述は2026年9月28日に公式Wikiと1文ずつ照合し、見つかった誤り74件を修正済みです。スキルのCD・射程・幅は公式Wiki（2026年9月28日確認）の値で、アイコンとスキル名はRiot公式のData Dragon（16.19.1）、動画はRiot公式サイトのものです（権利はRiot Gamesに帰属します）。図の一部は公式に数値がないため目安で描いています。</p>
      <div class="links" style="margin-top:8px"><a href="https://lolalytics.com/lol/drmundo/counters/" target="_blank" rel="noopener">LoLalytics：ムンドの対面一覧 ↗</a><a href="https://wiki.leagueoflegends.com/en-us/Dr._Mundo" target="_blank" rel="noopener">公式Wiki：ムンド ↗</a></div>
    </section>
  </div>`;
  openSheet(html);
  try { history.replaceState(null, '', '#basics'); } catch(e) {}
}

/* events */
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.f = b.dataset.f; save();
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderList();
});
$('#sort').addEventListener('change', e => { state.sort = e.target.value; save(); renderList(); });
$('#list').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openChamp(t.dataset.slug); });
$('#basicsBtn').addEventListener('click', openBasics);
$('#scrim').addEventListener('click', closeSheet);
function openVideo(e, a){
  const w = Math.min(720, Math.round(screen.availWidth * 0.9)), h = Math.round(w * 9 / 16) + 8;
  const left = Math.max(0, Math.round((screen.availWidth - w) / 2)), top = Math.max(0, Math.round((screen.availHeight - h) / 2));
  let win = null;
  try { win = window.open(a.href, 'skillvideo', `popup=yes,width=${w},height=${h},left=${left},top=${top}`); } catch(err) { win = null; }
  if (win){ e.preventDefault(); try { win.focus(); } catch(err) {} }
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.vid'); if (a) openVideo(e, a);
});
$('#sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeSheet();
  const t = e.target.closest('[data-alt]');
  if (t){
    const box = t.closest('.skill-grid'), on = t.getAttribute('aria-pressed') !== 'true';
    t.setAttribute('aria-pressed', on);
    box.querySelector('.variant[data-v="0"]').hidden = on;
    box.querySelector('.variant[data-v="1"]').hidden = !on;
    return;
  }
  const g = e.target.closest('[data-go]'); if (g) openChamp(g.dataset.go);
});
document.addEventListener('keydown', e => {
  if ($('#sheet').hidden) { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } return; }
  if (e.key === 'Escape') closeSheet();
  const g = document.querySelectorAll('#sheet [data-go]');
  if (e.key === 'ArrowLeft' && g[0] && document.activeElement.tagName !== 'INPUT') openChamp(g[0].dataset.go);
  if (e.key === 'ArrowRight' && g[1] && document.activeElement.tagName !== 'INPUT') openChamp(g[1].dataset.go);
});

/* init */
document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === state.f));
$('#sort').value = state.sort;
renderList();
const h = location.hash.slice(1);
if (h === 'basics') openBasics(); else if (h) openChamp(h, false);
})();
</script>
